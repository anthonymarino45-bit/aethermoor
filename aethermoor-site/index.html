function speedCfg(){return GAME_SPEEDS[(G&&G.settings&&G.settings.speed)||'standard']||GAME_SPEEDS.standard;}
function diffCfg(){return DIFFICULTIES[(G&&G.settings&&G.settings.difficulty)||'prince']||DIFFICULTIES.prince;}
function aiFactor(civ,k){return civ&&civ.ai&&!CIVS[civ.id].cs&&!CIVS[civ.id].barb?(diffCfg()[k]||1):1;}
function hasPromo(u,p){return !!(u&&u.promos&&u.promos.includes(p));}
function promoThreshold(n){return 10+n*15;}
function canPromote(u){return !!(u&&!isCiv(u)&&u.xp>=promoThreshold((u.promos||[]).length)&&promotionOptions(u).length);}
function promotionOptions(u){const cls=UNITS[u.k].cls,have=u.promos||[];return Object.keys(PROMOTIONS).filter(k=>{const p=PROMOTIONS[k];if(u.k==='archer'&&k==='range')return false;return p.cls.includes(cls)&&!have.includes(k)&&(!p.req||have.includes(p.req));});}
function unitRange(u){if(u&&u.k==='archer')return 2;return (UNITS[u.k].rng||1)+(hasPromo(u,'range')?1:0)+(hasHeroSkill(u,'rng_eagleeye')||hasHeroSkill(u,'mys_reach')?1:0);}
function unitMove(u){return UNITS[u.k].mv+(hasPromo(u,'mobility')?1:0)+(hasHeroSkill(u,'cmd_vanguard')||hasHeroSkill(u,'rng_shadowstep')?1:0);}
function unitSight(u){return (UNITS[u.k].sight||2)+(hasHeroTrait(u,'farstrider')?1:0);}
function unitAttacks(u){return 1+(hasPromo(u,'logistics')?1:0)+(hasHeroSkill(u,'brs_rampage')?1:0);}

const HERO_TREE_BY_CIV={0:['cmd_lionheart','cmd_vanguard','cmd_banner','cmd_inspiring'],10:['cmd_lionheart','cmd_vanguard','cmd_banner','cmd_inspiring'],1:['rng_deadeye','rng_eagleeye','rng_shadowstep','rng_pathmaster'],11:['rng_deadeye','rng_eagleeye','rng_shadowstep','rng_pathmaster'],2:['grd_bulwark','grd_unbroken','grd_hammer','grd_siegebreaker'],12:['grd_bulwark','grd_unbroken','grd_hammer','grd_siegebreaker'],3:['brs_fury','brs_rampage','brs_blooddrink','brs_momentum'],13:['brs_fury','brs_rampage','brs_blooddrink','brs_momentum'],4:['mys_spellpower','mys_reach','mys_soulward','mys_siphon'],14:['mys_spellpower','mys_reach','mys_soulward','mys_siphon']};
function heroSkills(u){u.heroSkills=u.heroSkills||[];return u.heroSkills;}
function hasHeroSkill(u,k){return !!(u&&heroSkills(u).includes(k));}
function heroSkillSlots(u){if(!u||!UNITS[u.k].hero)return 0;return HERO_XP_MILESTONES.filter(x=>(u.xp||0)>=x).length;}
function heroSkillPoints(u){return Math.max(0,heroSkillSlots(u)-heroSkills(u).length);}
function heroSkillOptions(u){if(!u||!UNITS[u.k].hero)return[];const tree=HERO_TREE_BY_CIV[UNITS[u.k].heroCiv]||[];return tree.filter(k=>!hasHeroSkill(u,k)&&(!HERO_SKILLS[k].req||hasHeroSkill(u,HERO_SKILLS[k].req)));}
function learnHeroSkill(u,k){if(!u||!UNITS[u.k].hero||heroSkillPoints(u)<=0||!heroSkillOptions(u).includes(k))return false;heroSkills(u).push(k);if(HERO_SKILLS[k].effect==='move1')u.mp=Math.min(unitMove(u),u.mp+1);note(u.o,`${UNITS[u.k].n} mastered ${HERO_SKILLS[k].n}.`,u,'good');return true;}
function autoLearnHeroSkills(u){if(!u||!UNITS[u.k].hero)return;let guard=6;while(heroSkillPoints(u)>0&&guard--){const opts=heroSkillOptions(u);if(!opts.length)break;learnHeroSkill(u,opts[Math.floor(Math.random()*opts.length)]);}}
function openHeroTree(id){const u=unitOf(id);if(!u||u.o!==G.player||!UNITS[u.k].hero)return;const tree=HERO_TREE_BY_CIV[UNITS[u.k].heroCiv]||[],branches=[...new Set(tree.map(k=>HERO_SKILLS[k].branch))];const pts=heroSkillPoints(u);modal(`<h1>★ ${UNITS[u.k].n} — Hero Talents</h1><div class="small">Hero XP: <b>${u.xp||0}</b> · Talent milestones: ${HERO_XP_MILESTONES.join(' / ')} XP · <span class="herolevel">${pts} talent point${pts===1?'':'s'} available</span></div><div class="herotree">${branches.map(br=>`<div class="herobranch"><b>${br}</b>${tree.filter(k=>HERO_SKILLS[k].branch===br).map(k=>{const sk=HERO_SKILLS[k],have=hasHeroSkill(u,k),ok=pts>0&&heroSkillOptions(u).includes(k),cl=have?'have':ok?'ready':'lock';return `<div class="heroskill ${cl}" ${ok?`onclick="chooseHeroSkill(${u.id},'${k}')"`:''}><b>${have?'✓ ':ok?'★ ':'🔒 '}${sk.n}</b><div class="small">${sk.d}${sk.req&&!have?`<br>Requires: ${HERO_SKILLS[sk.req].n}`:''}</div></div>`;}).join('')}</div>`).join('')}</div>`);}
function chooseHeroSkill(id,k){const u=unitOf(id);if(!u||u.o!==G.player)return;if(learnHeroSkill(u,k)){closeModal();selectUnit(u);if(heroSkillPoints(u)>0)setTimeout(()=>openHeroTree(u.id),60);}}

function heroTraits(u){u.heroTraits=u.heroTraits||[];return u.heroTraits;}
function hasHeroTrait(u,k){return !!(u&&heroTraits(u).includes(k));}
function heroStats(u){u.heroStats=u.heroStats||{kills:0,monsterKills:0,citiesCaptured:0,battles:0,damageDealt:0,damageTaken:0,turnsDeployed:0,tilesMoved:0,rangedKills:0,lowHpSurvivals:0,friendlyDefenseActions:0,wildTurns:0};return u.heroStats;}
function heroTraitEffectText(u){return heroTraits(u).map(k=>`${HERO_TRAITS[k].ico} ${HERO_TRAITS[k].n}`).join(' · ')||'No earned traits yet';}
function checkHeroTraits(u){if(!u||!UNITS[u.k]?.hero||heroTraits(u).length>=HERO_TRAIT_CAP)return;const st=heroStats(u);for(const k of Object.keys(HERO_TRAITS)){if(heroTraits(u).length>=HERO_TRAIT_CAP)break;if(hasHeroTrait(u,k)||!HERO_TRAITS[k].test(st,u))continue;heroTraits(u).push(k);const tr=HERO_TRAITS[k];note(u.o,`${UNITS[u.k].n} earned the Hero Trait ${tr.n}!`,u,'good');if(u.o===G.player){playSfx('great',.7);queueRealmEvent('Legend Forged',tr.ico,`<b>${UNITS[u.k].n}</b> has earned <b>${tr.n}</b>.<br><span class="small">${tr.d}<br>Earned traits are permanent parts of this Hero's legend. ${heroTraits(u).length}/${HERO_TRAIT_CAP} trait slots filled.</span>`,'View Hero',`openHeroSheet(${u.id})`);}}}
function heroLegacyFromUnit(u){return {k:u.k,xp:u.xp||0,promos:[...(u.promos||[])],heroSkills:[...heroSkills(u)],heroTraits:[...heroTraits(u)],heroStats:{...heroStats(u)},bornTurn:u.heroBornTurn||G.turn};}
function restoreHeroLegacy(u,civ){const l=civ&&civ.heroLegacy;if(!l||l.k!==u.k)return;u.xp=l.xp||0;u.promos=[...(l.promos||[])];u.heroSkills=[...(l.heroSkills||[])];u.heroTraits=[...(l.heroTraits||[])];u.heroStats={...heroStats(u),...(l.heroStats||{})};u.heroBornTurn=l.bornTurn||u.heroBornTurn;}
function hasHallOfLegends(civId){return !!(G&&G.cities&&G.cities.some(c=>c.o===civId&&c.bld&&c.bld.includes('halllegends')));}
function heroUnlockedForCiv(civ){return !!(civ&&(civ.heroUnlocked||heroActive(civ.id)||civ.heroLegacy));}
function heroStatus(civ){const h=heroActive(civ.id);if(h)return {n:'Active',detail:`${h.hp} HP · ${h.xp||0} XP`,active:h};if((civ.heroFallenUntil||0)>G.turn)return {n:'Fallen',detail:`Returns in ${civ.heroFallenUntil-G.turn} turns`,active:null};if(heroUnlockedForCiv(civ))return {n:'Available',detail:'Ready to train',active:null};if(civ.techs?.steel)return {n:'Locked',detail:'Build the Hall of Legends',active:null};return {n:'Locked',detail:'Research Steelcraft, then build the Hall of Legends',active:null};}
function heroEligibleCity(civId){const hk=heroUnitForCiv(civId);return G.cities.find(c=>c.o===civId&&!c.puppet&&!c.razing&&!c.resistance&&canBuild(c,{k:'unit',id:hk}))||G.cities.find(c=>c.o===civId&&!c.puppet&&!c.razing&&!c.resistance)||null;}
function openHeroTrainingCity(civId=G.player){const civ=civOf(civId);if(!heroUnlockedForCiv(civ)){toast(civ?.techs?.steel?'Complete the Hall of Legends to unlock your Hero.':'Research Steelcraft, then complete the Hall of Legends to unlock your Hero.');return;}const c=heroEligibleCity(civId);if(!c){toast('No eligible city can train your Hero right now.');return;}closeModal();centerOn(c.x,c.y);selectCity(c);setTimeout(()=>toast(`Choose ${UNITS[heroUnitForCiv(civId)].n} from the unit production list.`),80);}
function heroUnlockPresentation(civ,city=null,source='completed'){if(!civ||CIVS[civ.id].cs||CIVS[civ.id].barb||civ.heroUnlockPresented)return;const hk=heroUnitForCiv(civ.id),d=UNITS[hk];if(!hk||!d)return;civ.heroUnlockPresented=true;if(civ.id===G.player){const where=city?` in <b>${city.name}</b>`:'';const verb=source==='purchased'?'purchased':source==='rushed'?'completed by rushing':source==='captured'?'claimed':'completed';playSfx('great',.72);queueRealmEvent('Faction Hero Available',d.ico||'⭐',`<span class="legendBadge">HALL OF LEGENDS COMPLETE</span><br><br>Your Hall of Legends was ${verb}${where}.<br><br><b style="font-size:20px">${d.n}</b><br>${d.heroDesc}<br><span class="small">Your faction Hero is now unlocked and can be trained in any eligible city. Only one may be active at a time. Heroes earn normal XP, chosen talents, and up to ${HERO_TRAIT_CAP} permanent Traits through legendary accomplishments.</span>`,'Train Hero',`openHeroTrainingCity(${civ.id})`);}}
function syncHeroUnlockFromHall(civ,city=null,source='completed'){if(!civ||CIVS[civ.id].cs||CIVS[civ.id].barb)return false;if(heroUnlockedForCiv(civ)){if(civ.heroUnlocked&&!civ.heroUnlockPresented&&civ.id===G.player)heroUnlockPresentation(civ,city,source);return !!civ.heroUnlocked;}if(!hasTech(civ,'steel')||!hasHallOfLegends(civ.id))return false;civ.heroUnlocked=true;civ.heroReturnReadyNotified=false;note(civ.id,`${UNITS[heroUnitForCiv(civ.id)].n} is now available through the Hall of Legends.`,city,'good');heroUnlockPresentation(civ,city,source);return true;}
function onBuildingAcquired(c,id,source='completed'){const b=BLD[id],civ=civOf(c.o);if(!b)return;if(b.national){fx(c,'NATIONAL WONDER','#f6de9a');if(c.o===G.player&&id!=='halllegends'){playSfx('wonder');queueRealmEvent('National Wonder Complete',b.ico||'🏛️',`<b>${b.n}</b> has been completed in ${c.name}.<br><span class="small">Only one may exist in your realm.</span>`);}}if(id==='halllegends')syncHeroUnlockFromHall(civ,c,source);}
function openHeroSheet(id){let u=unitOf(id);let civ=u?civOf(u.o):civOf(G.player);if(!u&&civ){const l=civ.heroLegacy,hk=heroUnitForCiv(civ.id);if(!l||!hk){toast('Your Hero has not yet begun a legend.');return;}u={id:-1,k:hk,o:civ.id,hp:0,xp:l.xp||0,promos:[...(l.promos||[])],heroSkills:[...(l.heroSkills||[])],heroTraits:[...(l.heroTraits||[])],heroStats:{...l.heroStats}};}if(!u||!UNITS[u.k]?.hero)return;const d=UNITS[u.k],st=heroStats(u),status=heroStatus(civ),skills=heroSkills(u),traits=heroTraits(u);modal(`<div class="heroSheet"><div class="heroHead"><div class="heroPortrait">${d.ico||'⭐'}</div><div><h1 style="margin:0">${d.n}</h1><div class="legendStatus">${status.n} · ${status.detail}</div><div class="small">${CIVS[u.o].name} · ${d.heroDesc}</div></div></div><div class="heroStatGrid"><div class="heroStat"><b>${u.xp||0}</b><br><span class="small">XP</span></div><div class="heroStat"><b>${st.kills}</b><br><span class="small">Kills</span></div><div class="heroStat"><b>${st.battles}</b><br><span class="small">Battles</span></div><div class="heroStat"><b>${st.turnsDeployed}</b><br><span class="small">Turns Deployed</span></div><div class="heroStat"><b>${st.damageDealt}</b><br><span class="small">Damage Dealt</span></div><div class="heroStat"><b>${st.monsterKills}</b><br><span class="small">Monster Kills</span></div><div class="heroStat"><b>${st.citiesCaptured}</b><br><span class="small">Cities Captured</span></div><div class="heroStat"><b>${st.tilesMoved}</b><br><span class="small">Hexes Traveled</span></div></div><div class="sec">Earned Hero Traits · ${traits.length}/${HERO_TRAIT_CAP}</div><div class="heroTraitGrid">${[0,1,2].map(i=>{const k=traits[i];return k?`<div class="heroTrait"><b>${HERO_TRAITS[k].ico} ${HERO_TRAITS[k].n}</b><div class="small">${HERO_TRAITS[k].d}</div></div>`:`<div class="heroTrait empty"><b>◇ Unforged Trait</b><div class="small">Earned through exceptional deeds in battle and exploration.</div></div>`;}).join('')}</div><div class="sec">Chosen Talents</div><div class="small">${skills.length?skills.map(k=>`★ <b>${HERO_SKILLS[k].n}</b> — ${HERO_SKILLS[k].d}`).join('<br>'):'No Hero talents learned yet. Talent points unlock at '+HERO_XP_MILESTONES.join(', ')+' XP.'}</div><div style="display:flex;gap:8px;margin-top:14px">${status.active?`<button onclick="closeModal();jumpUnit(${status.active.id})">View on Map</button><button onclick="closeModal();openHeroTree(${status.active.id})">Hero Talents</button>`:status.n==='Available'?`<button onclick="openHeroTrainingCity(${civ.id})">Train Hero</button>`:''}<button onclick="openMilitaryOverview()">Hall of Legends</button></div></div>`);}

const AUDIO_FILES={menu:'music_menu.ogg',world:'music_world.ogg',battle:'music_battle.ogg',click:'sfx_click.ogg',move:'sfx_move.ogg',melee:'sfx_melee.ogg',arrow:'sfx_arrow.ogg',magic:'sfx_magic.ogg',city:'sfx_city.ogg',research:'sfx_research.ogg',wonder:'sfx_wonder.ogg',great:'sfx_great.ogg',turn:'sfx_turn.ogg',lair:'sfx_lair.ogg'};
let audioPrefs={music:.38,sfx:.58,musicOn:true,sfxOn:true},musicEl=null,musicKey='',audioUnlocked=false;
function loadAudioPrefs(){try{const a=JSON.parse(localStorage.getItem('aethermoor_audio')||'null');if(a)audioPrefs={...audioPrefs,...a};}catch(e){}return audioPrefs;}
function saveAudioPrefs(){try{localStorage.setItem('aethermoor_audio',JSON.stringify(audioPrefs));}catch(e){}}
function audioFile(k){return 'assets/audio/'+AUDIO_FILES[k];}
function playSfx(k,scale=1){if(!audioUnlocked||!audioPrefs.sfxOn||audioPrefs.sfx<=0||typeof Audio==='undefined'||!AUDIO_FILES[k])return;try{const a=new Audio(audioFile(k));a.volume=Math.max(0,Math.min(1,audioPrefs.sfx*scale));a.play().catch(()=>{});}catch(e){}}
function musicWanted(){if(!G||!running)return 'menu';const war=G.civs&&G.civs.some(o=>o.id!==G.player&&o.alive&&!CIVS[o.id].barb&&atWar(G.player,o.id));return war?'battle':'world';}
function refreshMusic(force=false){if(!audioUnlocked||typeof Audio==='undefined')return;const k=musicWanted();if(!audioPrefs.musicOn||audioPrefs.music<=0){if(musicEl)musicEl.pause();return;}if(!force&&musicEl&&musicKey===k&&!musicEl.paused){musicEl.volume=audioPrefs.music;return;}try{if(musicEl)musicEl.pause();musicKey=k;musicEl=new Audio(audioFile(k));musicEl.loop=true;musicEl.volume=audioPrefs.music;musicEl.play().catch(()=>{});}catch(e){}}
function unlockAudio(){if(!audioUnlocked){audioUnlocked=true;loadAudioPrefs();}refreshMusic();}
function setAudioPref(k,v){if(k==='music'||k==='sfx')audioPrefs[k]=Math.max(0,Math.min(1,parseFloat(v)||0));else audioPrefs[k]=!!v;saveAudioPrefs();if(musicEl)musicEl.volume=audioPrefs.music;refreshMusic(true);}
function openAudioSettings(){loadAudioPrefs();modal(`<h1>🔊 Audio</h1><div class="small" style="margin-bottom:12px">Original local soundtrack and effects — no internet connection required.</div><div class="audrow"><span>🎵 Music</span><input type="range" min="0" max="1" step="0.05" value="${audioPrefs.music}" oninput="setAudioPref('music',this.value)"><button onclick="setAudioPref('musicOn',!audioPrefs.musicOn);openAudioSettings()">${audioPrefs.musicOn?'On':'Off'}</button></div><div class="audrow"><span>🔉 Effects</span><input type="range" min="0" max="1" step="0.05" value="${audioPrefs.sfx}" oninput="setAudioPref('sfx',this.value)"><button onclick="setAudioPref('sfxOn',!audioPrefs.sfxOn);openAudioSettings()">${audioPrefs.sfxOn?'On':'Off'}</button></div><div style="margin-top:12px"><button onclick="playSfx('wonder')">Test Sound</button></div>`);}
loadAudioPrefs();

function moveCost(u,from,to){

  for(const n of nbrs(t.x,t.y))for(const e of unitsAt(n.x,n.y)){

function heapPush(h,n){h.push(n);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p].d<=h[i].d)break;[h[p],h[i]]=[h[i],h[p]];i=p;}}

// ---------- turn processing ----------

    if(sp){addUnit(ku,civ.id,sp.x,sp.y);note(civ.id,`${CIVS[k].name} sends a ${UNITS[ku].n} as a gift!`,sp,'good');}}
  if(!civ.pan&&civ.faith>=10&&civ.cities){if(civ.ai)adoptPantheon(civ,Object.keys(PANTHEON)[Math.floor(Math.random()*5)]);else G.needPan=true;}
  if(canFoundReligion(civ)){if(civ.ai){const F=Object.keys(FOUNDER),B=Object.keys(FOLLOWER);foundReligion(civ,F[Math.floor(Math.random()*F.length)],B[Math.floor(Math.random()*B.length)]);}else G.needRel=true;}

      const done=civ.res;civ.res=null;if(done==='ascend'&&!G.winner)G.winner={civ:civ.id,type:'Science'};if(done==='steel')syncHeroUnlockFromHall(civ,null,'completed');

// ---------- automation (player units set to auto-explore / auto-improve) ----------
function autoExplore(u){
  if(u.path&&u.path.length)runPath(u);
  if(u.mp<=1e-6||(u.path&&u.path.length))return;
  const v=G.vis[u.o],cands=[];
  for(const t of G.tiles){
    if(!v[idx(t.x,t.y)]||T[t.t].block||t.t==='ocean'||(t.x===u.x&&t.y===u.y))continue;
    if(!nbrs(t.x,t.y).some(n=>!v[idx(n.x,n.y)])||!canEnter(u,t))continue;
    cands.push({t,d:hdist(u,t)});
  }
  cands.sort((a,b)=>a.d-b.d);
  for(const c of cands.slice(0,8)){if(gotoTile(u,c.t.x,c.t.y))return;}
  u.auto=null;u.sleep=true;note(u.o,`${UNITS[u.k].n} has finished exploring.`,u,'good');
}
function runAuto(u){
  if(!u.auto||!G.units.includes(u))return;
  if(u.auto==='explore')autoExplore(u);
  else if(u.auto==='improve'){const civ=civOf(u.o);aiWorker(u,civ);}
}

function nextLivingHuman(){const hs=(G.humans||[G.player]).filter(id=>G.civs[id]&&G.civs[id].alive);if(!hs.length)return null;const i=Math.max(0,hs.indexOf(G.player));return i<hs.length-1?hs[i+1]:null;}

  G.player=id;G.humanIndex=Math.max(0,(G.humans||[]).indexOf(id));G.playerLogs=G.playerLogs||{};G.log=G.playerLogs[id]||(G.playerLogs[id]=[]);G.sel=null;reach=targets=selPath=null;cityView=null;rangedAttackMode=false;cityBombardMode=false;cityTileBuyMode=false;
  const civ=civOf(id);G.needTech=!civ.res&&techAvail(civ).length>0;G.needPan=!civ.pan&&civ.faith>=10&&civ.cities>0;G.needRel=canFoundReligion(civ);updateVision();miniDirty=true;

// ---------- diplomacy deals & trade ----------
const DEAL_LENGTH=30;
function ensureDealState(){if(!G.deals)G.deals=[];if(!G.pendingDeals)G.pendingDeals=[];if(!G.nextDealId)G.nextDealId=1;if(!G.embassies)G.embassies=[];}

function dealsBetween(a,b){return activeDeals().filter(d=>(d.a===a&&d.b===b)||(d.a===b&&d.b===a));}
function openBordersGranted(owner,visitor){for(const d of activeDeals()){if(d.a===owner&&d.b===visitor&&d.openA)return true;if(d.b===owner&&d.a===visitor&&d.openB)return true;}return false;}
function territoryAccess(owner,visitor){if(owner<0||owner===visitor||atWar(owner,visitor))return true;if(isCS(owner)){const st=infStatus(visitor,owner);return st==='Friendly'||st==='Allied';}return openBordersGranted(owner,visitor);}
function ejectUnitFromClosedBorder(u){const home=G.cities.find(c=>c.o===u.o);if(!home)return;const s=spawnSpot(home,u.k);if(s){u.x=s.x;u.y=s.y;u.path=null;u.setup=false;G._occ=null;}}
function ejectClosedBorderUnits(owner,visitor){for(const u of G.units){const t=G.tiles[idx(u.x,u.y)];if(u.o===visitor&&t.own===owner&&!territoryAccess(owner,visitor))ejectUnitFromClosedBorder(u);}}
function nativeLuxTypes(id){const out=new Set();for(const t of G.tiles)if(t.own===id&&t.r&&RES[t.r].type==='lux'&&(RES[t.r].free||t.imp===RES[t.r].imp)&&t.cid!==undefined)out.add(t.r);return out;}
function luxGivenAway(id){const out=new Set();for(const d of activeDeals()){if(d.a===id&&d.luxA)out.add(d.luxA);if(d.b===id&&d.luxB)out.add(d.luxB);}return out;}
function luxReceived(id){const out=new Set();for(const d of activeDeals()){if(d.a===id&&d.luxB)out.add(d.luxB);if(d.b===id&&d.luxA)out.add(d.luxA);}return out;}
function availableTradeLux(id){const native=nativeLuxTypes(id),sold=luxGivenAway(id);return [...native].filter(r=>!sold.has(r));}
function dealGoldFlow(id){let n=0;for(const d of activeDeals()){if(d.a===id)n+=(d.gptB||0)-(d.gptA||0);else if(d.b===id)n+=(d.gptA||0)-(d.gptB||0);}return n;}
function cancelDealsBetween(a,b){ensureDealState();const n=G.deals.length;G.deals=G.deals.filter(d=>!((d.a===a&&d.b===b)||(d.a===b&&d.b===a)));cancelStrategicAgreementsBetween(a,b);if(n!==G.deals.length&&(a===G.player||b===G.player))note(G.player,`Trade agreements with ${CIVS[a===G.player?b:a].name} were canceled by war.`,null,'bad');}
function cleanupDeals(){ensureDealState();const ended=G.deals.filter(d=>d.end<=G.turn);G.deals=G.deals.filter(d=>d.end>G.turn);for(const d of ended){if(d.openA)ejectClosedBorderUnits(d.a,d.b);if(d.openB)ejectClosedBorderUnits(d.b,d.a);if(d.a===G.player||d.b===G.player)note(G.player,`Trade agreement with ${CIVS[d.a===G.player?d.b:d.a].name} has expired.`,null,'');}G.pendingDeals=G.pendingDeals.filter(p=>p.expires>G.turn);}
function queuePeaceOffer(from){ensureDealState();if(from===G.player||!atWar(from,G.player))return;const existing=G.pendingDeals.find(p=>p.type==='peace'&&p.from===from);if(existing)return;G.pendingDeals.push({id:G.nextDealId++,type:'peace',from,to:G.player,created:G.turn,expires:G.turn+6});note(G.player,`${CIVS[from].leader} of ${CIVS[from].name} is open to peace. Open Diplomacy to negotiate a treaty.`,null,'good');}
function acceptPeaceOffer(id){ensureDealState();const p=G.pendingDeals.find(q=>q.id===id&&q.type==='peace');if(!p)return;if(!atWar(p.from,p.to)){G.pendingDeals=G.pendingDeals.filter(q=>q.id!==id);return openDiplo();}openTrade(p.from);}
function rejectPeaceOffer(id){ensureDealState();const p=G.pendingDeals.find(q=>q.id===id);if(p)note(G.player,`You rejected ${CIVS[p.from].name}'s peace offer.`,null,'');G.pendingDeals=G.pendingDeals.filter(q=>q.id!==id);openDiplo();}
function tradeValueSide(gold,gpt,lux,open){return Math.max(0,+gold||0)+Math.max(0,+gpt||0)*DEAL_LENGTH+(lux?115:0)+(open?45:0);}
function aiAcceptsTrade(other,d){const ai=civOf(other);let playerGives=tradeValueSide(d.yourGold,d.yourGPT,d.yourLux,d.yourOpen),aiGives=tradeValueSide(d.theirGold,d.theirGPT,d.theirLux,d.theirOpen);playerGives+=(d.yourEmb?25:0);aiGives+=(d.theirEmb?25:0);if(d.peace&&atWar(G.player,other)){const dur=G.turn-(ai.war[G.player]||G.turn);playerGives+=Math.max(0,dur-5)*5+(score(civOf(G.player))>score(ai)?45:10);aiGives+=10;}return playerGives+10>=aiGives*.92;}
let tradeDraft=null;
function openTrade(id){ensureDealState();const me=civOf(G.player),o=civOf(id);if(!o||!o.alive||!me.met[id])return;tradeDraft={other:id,yourGold:0,theirGold:0,yourGPT:0,theirGPT:0,yourLux:'',theirLux:'',yourOpen:false,theirOpen:false,yourEmb:false,theirEmb:false,peace:atWar(G.player,id)};renderTrade();}
function tdNum(k,v){if(!tradeDraft)return;tradeDraft[k]=Math.max(0,Math.floor(+v||0));}
function tdSet(k,v){if(tradeDraft)tradeDraft[k]=v;}
function renderTrade(){if(!tradeDraft)return;const id=tradeDraft.other,o=civOf(id),C=CIVS[id],me=civOf(G.player),mine=availableTradeLux(G.player),theirs=availableTradeLux(id),war=atWar(G.player,id);const luxOpts=(arr,sel)=>`<option value="">None</option>${arr.map(r=>`<option value="${r}" ${sel===r?'selected':''}>${RES[r].ico} ${RES[r].n}</option>`).join('')}`;const active=dealsBetween(G.player,id).map(d=>`<div class="small" style="padding:5px 0;border-bottom:1px solid #ffffff18">Until turn ${d.end}: ${d.a===G.player?`You → ${C.name}: ${d.gptA||0} GPT ${d.luxA?RES[d.luxA].ico:''}${d.openA?' · Open Borders':''}`:`${C.name} → You: ${d.gptA||0} GPT`} / ${d.b===G.player?`You → ${C.name}: ${d.gptB||0} GPT ${d.luxB?RES[d.luxB].ico:''}${d.openB?' · Open Borders':''}`:`${C.name} → You: ${d.gptB||0} GPT`}</div>`).join('');modal(`<h1>Trade with ${C.ico} ${C.name}</h1><div class="small">${C.leader} · ${war?'<span class="neg">AT WAR</span>':'<span class="pos">At Peace</span>'} · Deal length ${DEAL_LENGTH} turns</div><div class="tgrid" style="margin-top:12px"><div class="tcol"><h4>YOU GIVE</h4><div class="tech"><b>Gold</b><br><input type="number" min="0" max="${Math.floor(me.gold)}" value="${tradeDraft.yourGold}" oninput="tdNum('yourGold',this.value)" style="width:120px"></div><div class="tech"><b>Gold / turn</b><br><input type="number" min="0" max="50" value="${tradeDraft.yourGPT}" oninput="tdNum('yourGPT',this.value)" style="width:120px"></div><div class="tech"><b>Luxury</b><br><select onchange="tdSet('yourLux',this.value)">${luxOpts(mine,tradeDraft.yourLux)}</select></div><label class="tech"><input type="checkbox" ${tradeDraft.yourOpen?'checked':''} onchange="tdSet('yourOpen',this.checked)"> Grant Open Borders</label></div><div class="tcol"><h4>${C.name.toUpperCase()} GIVES</h4><div class="tech"><b>Gold</b><br><input type="number" min="0" max="${Math.floor(o.gold)}" value="${tradeDraft.theirGold}" oninput="tdNum('theirGold',this.value)" style="width:120px"></div><div class="tech"><b>Gold / turn</b><br><input type="number" min="0" max="50" value="${tradeDraft.theirGPT}" oninput="tdNum('theirGPT',this.value)" style="width:120px"></div><div class="tech"><b>Luxury</b><br><select onchange="tdSet('theirLux',this.value)">${luxOpts(theirs,tradeDraft.theirLux)}</select></div><label class="tech"><input type="checkbox" ${tradeDraft.theirOpen?'checked':''} onchange="tdSet('theirOpen',this.checked)"> Grant Open Borders</label></div></div>${war?`<label class="tech" style="display:block;margin-top:10px"><input type="checkbox" ${tradeDraft.peace?'checked':''} onchange="tdSet('peace',this.checked)"> Include Peace Treaty</label>`:''}<div style="display:flex;gap:8px;margin-top:12px"><button onclick="submitTrade()">🤝 Propose Deal</button><button onclick="openDiplo()">Back</button></div>${active?`<div class="sec">Active Agreements</div>${active}`:''}<div class="small" style="margin-top:8px">Luxury trades affect happiness. Open Borders lets military units cross that realm while at peace. Peace never takes effect without your explicit approval.</div>`);}
function submitTrade(){if(!tradeDraft)return;ensureDealState();const d=tradeDraft,id=d.other,me=civOf(G.player),o=civOf(id);if(atWar(G.player,id)&&!d.peace){toast('A trade deal during war must include a Peace Treaty.');return renderTrade();}if(d.yourGold>me.gold||d.theirGold>o.gold){toast('One side does not have enough gold for that offer.');return renderTrade();}if(d.yourLux&&!availableTradeLux(G.player).includes(d.yourLux)){toast('That luxury is no longer available to trade.');return renderTrade();}if(d.theirLux&&!availableTradeLux(id).includes(d.theirLux)){toast(`${CIVS[id].name} no longer has that luxury available.`);return renderTrade();}if(d.peace&&!atWar(G.player,id))d.peace=false;if(d.yourEmb&&hasEmbassy(id,G.player))d.yourEmb=false;if(d.theirEmb&&hasEmbassy(G.player,id))d.theirEmb=false;if(!aiAcceptsTrade(id,d)){toast(`${CIVS[id].leader} rejects the offer. Improve the terms and try again.`);return renderTrade();}me.gold-=d.yourGold;o.gold+=d.yourGold;o.gold-=d.theirGold;me.gold+=d.theirGold;if(d.yourGPT||d.theirGPT||d.yourLux||d.theirLux||d.yourOpen||d.theirOpen)G.deals.push({id:G.nextDealId++,a:G.player,b:id,start:G.turn,end:G.turn+DEAL_LENGTH,gptA:d.yourGPT,gptB:d.theirGPT,luxA:d.yourLux||null,luxB:d.theirLux||null,openA:!!d.yourOpen,openB:!!d.theirOpen});if(d.yourEmb)addEmbassy(id,G.player);if(d.theirEmb){addEmbassy(G.player,id);const cc=embassyCapital(id);if(cc)note(G.player,`Your embassy in ${cc.name} lets you see ${CIVS[id].name}'s capital.`,cc,'good');}updateVision();miniDirty=true;if(d.peace&&atWar(G.player,id))makePeace(G.player,id);note(G.player,`Trade deal signed with ${CIVS[id].name}.`,null,'good');playSfx('great',.45);recalcCiv(me);recalcCiv(o);openDiplo();hud();}


// ===== V4.5 international trade routes, research agreements, defensive pacts & espionage =====
const TRADE_ROUTE_LENGTH=30, RESEARCH_AGREEMENT_LENGTH=30, DEF_PACT_LENGTH=30;
function ensureV45State(){
  if(!G.tradeRoutes)G.tradeRoutes=[];if(!G.nextTradeRouteId)G.nextTradeRouteId=1;
  if(!G.researchAgreements)G.researchAgreements=[];if(!G.defPacts)G.defPacts=[];if(!G.nextAgreementId)G.nextAgreementId=1;
  for(const civ of G.civs)if(civ.spy===undefined)civ.spy=null;
}
function tradeSlots(civ){return Math.max(1,1+(civ.techs.currency?1:0)+(civ.techs.nav?1:0));}
function activeTradeRoutes(){ensureV45State();return G.tradeRoutes.filter(r=>r.end>G.turn);}
function tradeRouteBlocked(r){if(!r||r.type!=='sea')return false;const a=cityOf(r.origin),b=cityOf(r.dest);return !!((a&&cityBlockaded(a))||(b&&cityBlockaded(b)));}
function tradeRouteFlow(id){if(!G)return {gold:0,sci:0};ensureV45State();let gold=0,sci=0;for(const r of activeTradeRoutes()){if(tradeRouteBlocked(r))continue;if(r.owner===id){gold+=r.gold||0;sci+=r.sci||0;}else if(r.destOwner===id){gold+=r.partnerGold||0;}}return {gold,sci};}
function tradeRouteRange(type){return type==='sea'?20:10;}
function tradeRouteCandidate(origin,dest,type,owner){
  if(!origin||!dest||origin.id===dest.id||origin.o!==owner||atWar(owner,dest.o))return false;
  const civ=civOf(owner);if(dest.o!==owner&&!civ.met[dest.o])return false;
  if(hdist(origin,dest)>tradeRouteRange(type))return false;
  if(type==='sea'){if(!civ.techs.sail||!isCoastal(origin)||!isCoastal(dest))return false;}
  else{if(!civ.techs.husb)return false;const a=tileAt(origin.x,origin.y),b=tileAt(dest.x,dest.y);if(!a||!b||!landConnected(a,b))return false;}
  if(activeTradeRoutes().some(r=>r.owner===owner&&r.origin===origin.id&&r.dest===dest.id&&r.type===type))return false;
  return true;
}
function tradeRouteYield(owner,destOwner,origin,dest,type){const other=civOf(destOwner),mine=civOf(owner),foreign=owner!==destOwner;const techGap=Math.max(0,Object.keys(other.techs).length-Object.keys(mine.techs).length);return {gold:Math.max(2,Math.round(2+dest.pop*.7+origin.pop*.25+(foreign?2:0)+(type==='sea'?1:0))),sci:foreign?Math.max(1,Math.min(5,1+techGap*.35)):0,partnerGold:foreign?1:0};}
function establishTradeRoute(originId,destId,type,owner=G.player,quiet=false){ensureV45State();const civ=civOf(owner),origin=cityOf(originId),dest=cityOf(destId);if(!origin||!dest||!tradeRouteCandidate(origin,dest,type,owner))return false;const used=activeTradeRoutes().filter(r=>r.owner===owner).length;if(used>=tradeSlots(civ)){if(!quiet&&owner===G.player)toast('All trade route slots are currently in use.');return false;}const y=tradeRouteYield(owner,dest.o,origin,dest,type),len=Math.max(15,Math.round(TRADE_ROUTE_LENGTH*speedCfg().cost));const r={id:G.nextTradeRouteId++,owner,origin:origin.id,dest:dest.id,destOwner:dest.o,type,start:G.turn,end:G.turn+len,...y};G.tradeRoutes.push(r);if(owner===G.player){note(owner,`${type==='sea'?'Cargo Ship':'Caravan'} route established: ${origin.name} → ${dest.name} (+${y.gold} gold, +${y.sci} science/turn).`,origin,'good');playSfx('great',.35);}recalcCiv(civ);if(dest.o!==owner)recalcCiv(civOf(dest.o));return true;}
function cleanupTradeRoutes(){ensureV45State();const ended=[];G.tradeRoutes=G.tradeRoutes.filter(r=>{const o=cityOf(r.origin),d=cityOf(r.dest),bad=!o||!d||o.o!==r.owner||d.o!==r.destOwner||atWar(r.owner,r.destOwner)||r.end<=G.turn;if(bad)ended.push(r);return !bad;});for(const r of ended)if(r.owner===G.player||r.destOwner===G.player){const o=cityOf(r.origin),d=cityOf(r.dest);note(G.player,`Trade route ${o?o.name:'Origin'} → ${d?d.name:'Destination'} has ended.`,o||d||null,'');}}
function openTradeRoutes(originId){ensureV45State();const civ=civOf(G.player),active=activeTradeRoutes().filter(r=>r.owner===G.player),slots=tradeSlots(civ);let origins=G.cities.filter(c=>c.o===G.player);if(originId){const c=cityOf(originId);if(c&&c.o===G.player)origins=[c,...origins.filter(q=>q!==c)];}
  const activeHtml=active.length?active.map(r=>{const o=cityOf(r.origin),d=cityOf(r.dest);return `<div class="row" style="cursor:default"><span>${r.type==='sea'?'🚢':'🚚'} <b>${o?o.name:'?'}</b> → ${d?d.name:'?'} <span class="small">(${CIVS[r.destOwner].name})</span></span><span class="small">+${r.gold}🪙 +${r.sci}🔬 · ${Math.max(0,r.end-G.turn)}t</span></div>`;}).join(''):'<div class="small">No active international routes.</div>';
  let opts='';for(const o of origins){const cand=[];for(const d of G.cities){for(const type of ['land','sea'])if(tradeRouteCandidate(o,d,type,G.player)){const y=tradeRouteYield(G.player,d.o,o,d,type);cand.push({d,type,y});}}cand.sort((a,b)=>(b.y.gold+b.y.sci*2)-(a.y.gold+a.y.sci*2));if(cand.length)opts+=`<div class="sec">From ${o.name}</div>`+cand.slice(0,10).map(q=>`<div class="row"><span>${q.type==='sea'?'🚢 Cargo Ship':'🚚 Caravan'} → <b>${q.d.name}</b> <span class="small">${CIVS[q.d.o].name}</span></span><span><span class="small">+${q.y.gold}🪙 +${q.y.sci}🔬</span> <button ${active.length>=slots?'disabled':''} onclick="establishTradeRoute(${o.id},${q.d.id},'${q.type}');openTradeRoutes(${o.id})">Establish</button></span></div>`).join('');}
  modal(`<h1>🚚 Trade Routes</h1><div class="small">${active.length}/${slots} route slots used. Caravans unlock with Beastmastery (range 10); Cargo Ships unlock with Seafaring (range 20 between coastal cities). Routes provide continuous gold and science until they expire or war interrupts them.</div><div class="sec">Active Routes</div>${activeHtml}${opts||'<div class="sec">Available Routes</div><div class="small">No valid routes are currently available. Meet another realm, research Beastmastery/Seafaring, or found additional cities.</div>'}`);}
function aiManageTradeRoutes(civ){ensureV45State();if(!civ.ai||CIVS[civ.id].cs||CIVS[civ.id].barb)return;let used=activeTradeRoutes().filter(r=>r.owner===civ.id).length,slots=tradeSlots(civ);if(used>=slots)return;const choices=[];for(const o of G.cities.filter(c=>c.o===civ.id))for(const d of G.cities)for(const type of ['land','sea'])if(tradeRouteCandidate(o,d,type,civ.id)){const y=tradeRouteYield(civ.id,d.o,o,d,type);choices.push({o,d,type,v:y.gold+y.sci*2});}choices.sort((a,b)=>b.v-a.v);for(const q of choices){if(used>=slots)break;if(establishTradeRoute(q.o.id,q.d.id,q.type,civ.id,true))used++;}}

function researchAgreementCost(civ){return Math.max(100,Math.round((120+Object.keys(civ.techs).length*9)*speedCfg().cost));}
function activeResearchAgreement(a,b){ensureV45State();return G.researchAgreements.find(r=>r.end>G.turn&&((r.a===a&&r.b===b)||(r.a===b&&r.b===a)));}
function canResearchAgreement(a,b){const A=civOf(a),B=civOf(b);return !!(A&&B&&A.alive&&B.alive&&!atWar(a,b)&&A.met[b]&&A.techs.phil&&B.techs.phil&&!activeResearchAgreement(a,b));}
function startResearchAgreement(a,b,quiet=false){ensureV45State();if(!canResearchAgreement(a,b))return false;const A=civOf(a),B=civOf(b),ca=researchAgreementCost(A),cb=researchAgreementCost(B);if(A.gold<ca||B.gold<cb){if(!quiet&&(a===G.player||b===G.player))toast('Both realms need enough gold to fund the Research Agreement.');return false;}A.gold-=ca;B.gold-=cb;G.researchAgreements.push({id:G.nextAgreementId++,a,b,start:G.turn,end:G.turn+Math.max(15,Math.round(RESEARCH_AGREEMENT_LENGTH*speedCfg().cost)),costA:ca,costB:cb});if(a===G.player||b===G.player)note(G.player,`Research Agreement signed with ${CIVS[a===G.player?b:a].name}.`,null,'good');return true;}
function researchAgreementBonus(civ){const av=techAvail(civ);if(!av.length)return 0;return Math.round(av.reduce((s,k)=>s+techCost(k),0)/av.length*.5);}
function processResearchAgreements(){ensureV45State();const done=G.researchAgreements.filter(r=>r.end<=G.turn),keep=G.researchAgreements.filter(r=>r.end>G.turn);G.researchAgreements=keep;for(const r of done){for(const id of [r.a,r.b]){const civ=civOf(id);if(!civ||!civ.alive)continue;const b=researchAgreementBonus(civ);civ.sci+=b;if(id===G.player)note(G.player,`Research Agreement completed: +${b} science.`,null,'good');}}}
function defensivePact(a,b){ensureV45State();return G.defPacts.find(p=>p.end>G.turn&&((p.a===a&&p.b===b)||(p.a===b&&p.b===a)));}
function canDefensivePact(a,b){const A=civOf(a),B=civOf(b);return !!(A&&B&&A.alive&&B.alive&&!atWar(a,b)&&A.met[b]&&A.techs.chival&&B.techs.chival&&!defensivePact(a,b));}
function startDefensivePact(a,b,quiet=false){ensureV45State();if(!canDefensivePact(a,b))return false;G.defPacts.push({id:G.nextAgreementId++,a,b,start:G.turn,end:G.turn+Math.max(15,Math.round(DEF_PACT_LENGTH*speedCfg().cost))});if(a===G.player||b===G.player)note(G.player,`Defensive Pact signed with ${CIVS[a===G.player?b:a].name}.`,null,'good');return true;}
function defensivePartners(id){ensureV45State();const out=[];for(const p of G.defPacts)if(p.end>G.turn){if(p.a===id)out.push(p.b);else if(p.b===id)out.push(p.a);}return out;}
function cancelOffensivePacts(id){ensureV45State();const old=G.defPacts.length;G.defPacts=G.defPacts.filter(p=>p.a!==id&&p.b!==id);if(old!==G.defPacts.length&&id===G.player)note(G.player,'Your Defensive Pacts were cancelled because you declared an offensive war.',null,'bad');}
function cleanupDefensivePacts(){ensureV45State();G.defPacts=G.defPacts.filter(p=>p.end>G.turn&&civOf(p.a)?.alive&&civOf(p.b)?.alive&&!atWar(p.a,p.b));}
function cancelStrategicAgreementsBetween(a,b){ensureV45State();const before=G.researchAgreements.length;G.researchAgreements=G.researchAgreements.filter(r=>!((r.a===a&&r.b===b)||(r.a===b&&r.b===a)));G.defPacts=G.defPacts.filter(r=>!((r.a===a&&r.b===b)||(r.a===b&&r.b===a)));G.tradeRoutes=G.tradeRoutes.filter(r=>!((r.owner===a&&r.destOwner===b)||(r.owner===b&&r.destOwner===a)));if(before!==G.researchAgreements.length&&(a===G.player||b===G.player))note(G.player,'A Research Agreement was cancelled by war; the investment was lost.',null,'bad');}
function openAgreements(id){ensureV45State();const C=CIVS[id],ra=activeResearchAgreement(G.player,id),dp=defensivePact(G.player,id),me=civOf(G.player),o=civOf(id);modal(`<h1>📜 Agreements with ${C.ico} ${C.name}</h1><div class="small">${C.leader}</div><div class="sec">Research Agreement</div>${ra?`<div class="tech have">Active · completes in ${ra.end-G.turn} turns</div>`:`<div class="tech"><b>Joint Research</b><br>Requires Philosophy for both realms. Both pay gold now; when the agreement matures, both gain a major science burst.<br><button ${canResearchAgreement(G.player,id)&&me.gold>=researchAgreementCost(me)&&o.gold>=researchAgreementCost(o)?'':'disabled'} onclick="startResearchAgreement(${G.player},${id});openAgreements(${id})">Sign · You pay ${researchAgreementCost(me)}🪙</button></div>`}<div class="sec">Defensive Pact</div>${dp?`<div class="tech have">Active · ${dp.end-G.turn} turns remaining</div>`:`<div class="tech"><b>Mutual Defense</b><br>Requires Chivalry for both realms. If either signer is attacked, the partner automatically joins the defensive war.<br><button ${canDefensivePact(G.player,id)?'':'disabled'} onclick="startDefensivePact(${G.player},${id});openAgreements(${id})">Sign Defensive Pact</button></div>`}<div style="margin-top:12px"><button onclick="openDiplo()">Back to Diplomacy</button></div>`);}

const SPY_NAMES=['Whisper','Veil','Rook','Ash','Shade','Lantern','Vesper','Fox','Moth','Cipher'];
function spyUnlocked(civ){return !!(civ&&civ.techs&&civ.techs.educ&&!CIVS[civ.id].cs&&!CIVS[civ.id].barb);}
function ensureSpy(civ){if(!spyUnlocked(civ))return null;if(!civ.spy)civ.spy={name:SPY_NAMES[civ.id%SPY_NAMES.length],target:null,mode:'idle',since:G.turn,level:1,cooldown:0};return civ.spy;}
function assignSpy(cityId,mode){const civ=civOf(G.player),spy=ensureSpy(civ),c=cityOf(cityId);if(!spy||!c)return;if(mode==='steal'&&(c.o===G.player||CIVS[c.o].cs))return;if(mode==='rig'&&!CIVS[c.o].cs)return;if(mode==='counter'&&c.o!==G.player)return;spy.target=c.id;spy.mode=mode;spy.since=G.turn;spy.cooldown=0;note(G.player,`${spy.name} assigned to ${c.name}.`,c,'good');openEspionage();}
function counterSpyIn(cityId,owner){const civ=civOf(owner);return !!(civ&&civ.spy&&civ.spy.mode==='counter'&&civ.spy.target===cityId);}
function processEspionage(civ){const spy=ensureSpy(civ);if(!spy||spy.mode==='idle'||spy.target==null)return;const c=cityOf(spy.target);if(!c){spy.target=null;spy.mode='idle';return;}if(spy.cooldown>0){spy.cooldown--;return;}const interval=Math.max(8,Math.round(12*speedCfg().cost));if(G.turn-spy.since<interval)return;spy.since=G.turn;
  if(spy.mode==='steal'){const target=civOf(c.o),steal=Object.keys(target.techs).filter(k=>target.techs[k]&&!civ.techs[k]);if(!steal.length)return;let chance=.72+Math.min(.12,(spy.level-1)*.04);if(counterSpyIn(c.id,c.o))chance-=.38;if(Math.random()<chance){const k=steal[Math.floor(Math.random()*steal.length)];civ.techs[k]=true;spy.level=Math.min(3,spy.level+1);if(civ.id===G.player)note(G.player,`${spy.name} stole ${TECH[k].n} from ${CIVS[c.o].name}!`,c,'good');if(c.o===G.player)note(G.player,`Enemy espionage stole ${TECH[k].n} from ${c.name}!`,c,'bad');}else{if(Math.random()<.22){spy.cooldown=interval;spy.level=1;if(civ.id===G.player)note(G.player,`${spy.name}'s operation in ${c.name} was exposed.`,c,'bad');if(c.o===G.player)note(G.player,`Counter-intelligence exposed an enemy spy in ${c.name}.`,c,'good');}}}
  else if(spy.mode==='rig'&&CIVS[c.o].cs){civ.inf[c.o]=Math.min(100,(civ.inf[c.o]||0)+20+spy.level*3);for(const o of G.civs)if(o.id!==civ.id&&o.inf)o.inf[c.o]=Math.max(0,(o.inf[c.o]||0)-5);if(civ.id===G.player)note(G.player,`${spy.name} rigged elections in ${c.name}: influence increased.`,c,'good');}
}
function aiAssignSpy(civ){const spy=ensureSpy(civ);if(!spy||spy.target!=null)return;const rivals=G.cities.filter(c=>c.o!==civ.id&&!CIVS[c.o].cs&&!CIVS[c.o].barb&&civ.met[c.o]);if(rivals.length){rivals.sort((a,b)=>b.pop-a.pop);spy.target=rivals[0].id;spy.mode='steal';spy.since=G.turn;return;}const css=G.cities.filter(c=>CIVS[c.o].cs&&civ.met[c.o]);if(css.length){spy.target=css[0].id;spy.mode='rig';spy.since=G.turn;}}
function openEspionage(){const civ=civOf(G.player);if(!spyUnlocked(civ)){modal(`<h1>🕵️ Espionage</h1><p>Espionage unlocks with <b>Arcane Academy</b> technology. Your first spy can then steal technologies, conduct counter-intelligence, or influence city-states.</p>`);return;}const spy=ensureSpy(civ),target=spy.target!=null?cityOf(spy.target):null;let rows='';for(const c of G.cities){if(c.o===G.player)rows+=`<div class="row"><span>🛡️ ${c.name} <span class="small">Counter-intelligence</span></span><button onclick="assignSpy(${c.id},'counter')">Assign</button></div>`;else if(CIVS[c.o].cs&&civ.met[c.o])rows+=`<div class="row"><span>🎭 ${c.name} <span class="small">${CIVS[c.o].name} · rig elections</span></span><button onclick="assignSpy(${c.id},'rig')">Assign</button></div>`;else if(civ.met[c.o]&&!CIVS[c.o].barb)rows+=`<div class="row"><span>🔬 ${c.name} <span class="small">${CIVS[c.o].name} · steal technology</span></span><button onclick="assignSpy(${c.id},'steal')">Assign</button></div>`;}
  modal(`<h1>🕵️ Espionage</h1><div class="tech have"><b>Agent ${spy.name}</b> · Level ${spy.level}<br>${target?`${spy.mode==='steal'?'Stealing technology':spy.mode==='rig'?'Rigging elections':'Counter-intelligence'} in ${target.name}`:'Awaiting assignment'}${spy.cooldown?` · compromised for ${spy.cooldown}t`:''}</div><div class="sec">Assignments</div>${rows}`);}

// ---------- vision ----------
function updateVision(){
  const v=G.vis[G.player];if(!v)return;
  for(let i=0;i<v.length;i++)if(v[i]===2)v[i]=1;
  const see=(x,y,r)=>{for(const t of tilesIn(x,y,r)){v[idx(t.x,t.y)]=2;
      if(t.own>=0&&t.own!==G.player)meet(G.player,t.own);}};
  for(const u of G.units)if(u.o===G.player){see(u.x,u.y,unitSight(u));}
  for(const c of G.cities)if(c.o===G.player)see(c.x,c.y,3);
  if(G.embassies)for(const e of G.embassies)if(e[0]===G.player){const cap=embassyCapital(e[1]);if(cap&&civOf(e[1])&&civOf(e[1]).alive)see(cap.x,cap.y,2);}
  for(const u of G.units)if(u.o!==G.player&&v[idx(u.x,u.y)]===2)meet(G.player,u.o);
  const pc=civOf(G.player);for(const t of G.tiles)if(t.nw&&v[idx(t.x,t.y)]===2&&!pc.nwSeen?.[t.nw])discoverNaturalWonders(pc,t.x,t.y,0);
}
function meet(a,b){if(isBarb(a)||isBarb(b))return;if(!G.civs[a].met[b]){G.civs[a].met[b]=G.civs[b].met[a]=true;note(a,`We have met ${CIVS[b].name}!`,null,'good');}}
function declareWar(a,b,fromPact=false){if(a===b||atWar(a,b))return;ensureV45State();const defenders=defensivePartners(b).filter(p=>p!==a&&!atWar(p,a));if(!fromPact)cancelOffensivePacts(a);if(isCS(b)&&G.civs[a].inf){G.civs[a].inf[b]=0;if(G.civs[a].protectedCS)delete G.civs[a].protectedCS[b];for(const civ of G.civs)if(civ.id!==a&&!CIVS[civ.id].cs&&!CIVS[civ.id].barb&&civ.protectedCS&&civ.protectedCS[b]?.active){civ.inf[b]=Math.min(100,(civ.inf[b]||0)+10);note(civ.id,`${CIVS[a].name} attacked protected ${CIVS[b].name}.`,null,'bad');}}cancelDealsBetween(a,b);G.civs[a].war[b]=G.civs[b].war[a]=G.turn;G.civs[a].met[b]=G.civs[b].met[a]=true;
  note(G.player,`⚔️ WAR DECLARED — ${CIVS[a].name} has declared war on ${CIVS[b].name}!`,null,'war');
  if(a===G.player||b===G.player){banner('WAR DECLARED');playSfx('melee',.9);}
  for(const p of defenders){note(G.player,`🛡️ ${CIVS[p].name} honors its Defensive Pact with ${CIVS[b].name} and joins the war against ${CIVS[a].name}.`,null,'war');declareWar(p,a,true);}
}
function makePeace(a,b){delete G.civs[a].war[b];delete G.civs[b].war[a];G.civs[a].peace=G.civs[a].peace||{};G.civs[a].peace[b]=G.turn;G.civs[b].peace=G.civs[b].peace||{};G.civs[b].peace[a]=G.turn;
  for(const u of G.units){const t=G.tiles[idx(u.x,u.y)];if(t.own>=0&&t.own!==u.o&&(u.o===a&&t.own===b||u.o===b&&t.own===a)){
    const home=G.cities.find(c=>c.o===u.o);if(home){const s=spawnSpot(home,u.k);if(s){u.x=s.x;u.y=s.y;u.path=null;}}}}
  G._occ=null;ensureDealState();G.pendingDeals=G.pendingDeals.filter(p=>!((p.from===a&&p.to===b)||(p.from===b&&p.to===a)));note(G.player,`${CIVS[a].name} and ${CIVS[b].name} made peace.`);}

// ---------- worker jobs ----------
function startJob(u,type){
  const t=G.tiles[idx(u.x,u.y)];
  if(type==='road'){if(t.road||!hasTech(civOf(u.o),'wheel')||T[t.t].water)return false;u.job={type,left:Math.max(1,Math.round(3*speedCfg().job))};}
  else{const i=type||bestImprovement(t,civOf(u.o));if(!i||t.own!==u.o)return false;u.job={type:i,left:Math.max(1,Math.round(IMP[i].turns*speedCfg().job))};}
  u.fort=false;u.sleep=false;u.path=null;return true;
}

// ---------- world discoveries ----------
function resolveWorldSite(u,t){
  const kind=t.site,s=SITE[kind];if(!s)return;
  const civ=civOf(u.o),R=Math.random();let msg='';
  if(kind==='antiquity'){if(u.k!=='scout'||!hasTech(civ,'educ')){if(u.o===G.player)toast('A Pathfinder with Arcane Academy knowledge is required to excavate this Antiquity Site.');return;}const near=G.cities.filter(c=>c.o===u.o).sort((a,b)=>hdist(a,t)-hdist(b,t))[0];const w=createGreatWork(civ,'Artifact',near&&near.id);if(!w)return;msg=`Antiquity excavated: ${w.name} recovered.`;}
  else if(kind==='ruins'){
    if(R<.34){const n=30+Math.floor(Math.random()*31);civ.gold+=n;msg=`Ancient Ruins explored: +${n} gold.`;}
    else if(R<.67){const n=18+Math.floor(Math.random()*19);civ.sci+=n;msg=`Ancient tablets recovered: +${n} science.`;}
    else{const n=12+Math.floor(Math.random()*13);civ.cul+=n;msg=`Lost histories recovered: +${n} culture.`;}
  }else if(kind==='shrine'){
    const f=15+Math.floor(Math.random()*16);civ.faith+=f;msg=`Moon Shrine awakened: +${f} faith.`;
  }else{
    const sc=22+Math.floor(Math.random()*20);civ.sci+=sc;msg=`Abandoned Tower searched: +${sc} science and the surrounding lands are revealed.`;
    if(u.o===G.player)for(const q of tilesIn(t.x,t.y,5))G.vis[G.player][idx(q.x,q.y)]=2;
  }
  t.site=null;G.sites=(G.sites||[]).filter(q=>q.x!==t.x||q.y!==t.y);note(u.o,msg,t,'good');fx(t,'DISCOVERED','#f6de9a');recalcCiv(civ);
}

// ---------- save / load ----------
function saveGame(){try{rememberHumanCamera(G.player);const o={...G,vis:G.vis.map(v=>Array.from(v)),_occ:null,fx:[],anim:[]};localStorage.setItem('aethermoor_save2',JSON.stringify(o));return true;}catch(e){return false;}}
function loadGame(){try{const s=localStorage.getItem('aethermoor_save2');if(!s)return false;const o=JSON.parse(s);o.vis=o.vis.map(v=>Uint8Array.from(v));o.fx=[];o.anim=[];o.sites=o.sites||[];o.naturalWonders=o.naturalWonders||[];o.camps=o.camps||[];o.settings={difficulty:'prince',speed:'standard',mapType:'continents',mapSize:'standard',cityStates:4,worldAge:'standard',temperature:'temperate',rainfall:'normal',seaLevel:'medium',resources:'standard',monsters:'standard',naturalWonders:'standard',...(o.settings||{})};o.maxTurn=o.maxTurn||GAME_SPEEDS[o.settings.speed].maxTurn;o.humans=o.humans&&o.humans.length?o.humans:[o.player];o.humanIndex=Math.max(0,o.humans.indexOf(o.player));o.playerLogs=o.playerLogs||{};if(!o.playerLogs[o.player])o.playerLogs[o.player]=o.log||[];o.log=o.playerLogs[o.player];o.eventQueue=[];o.deals=o.deals||[];o.pendingDeals=o.pendingDeals||[];o.nextDealId=o.nextDealId||1;o.tradeRoutes=o.tradeRoutes||[];o.nextTradeRouteId=o.nextTradeRouteId||1;o.researchAgreements=o.researchAgreements||[];o.defPacts=o.defPacts||[];o.nextAgreementId=o.nextAgreementId||1;o.csQuests=o.csQuests||{};o.nextQuestId=o.nextQuestId||1;for(const t of o.tiles){if(t.site===undefined)t.site=null;if(t.nw===undefined)t.nw=null;}for(const c of o.cities){c.queue=c.queue||[];if(c.founder===undefined)c.founder=c.o;c.resistance=c.resistance||0;c.puppet=!!c.puppet;c.razing=!!c.razing;c.capturedCapital=!!c.capturedCapital;c.spec=c.spec||{scientist:0,engineer:0,merchant:0,priest:0,artist:0};if(c.spec.artist===undefined)c.spec.artist=0;}for(const civ of o.civs){if(civ.spy===undefined)civ.spy=null;civ.gp=civ.gp||{scientist:0,engineer:0,merchant:0,general:0,prophet:0};civ.gpMade=civ.gpMade||{scientist:0,engineer:0,merchant:0,general:0,prophet:0};civ.gpr=civ.gpr||{scientist:0,engineer:0,merchant:0,prophet:0};civ.gaMeter=civ.gaMeter||0;civ.gaCount=civ.gaCount||0;civ.gaTurns=civ.gaTurns||0;civ.nwSeen=civ.nwSeen||{};civ.heritage=civ.heritage||0;civ.tourism=civ.tourism||0;civ.greatWorks=civ.greatWorks||[];civ.inspiration=civ.inspiration||0;civ.inspirationRate=civ.inspirationRate||0;civ.cultureLifetime=civ.cultureLifetime||25;civ.culturalInfluence=civ.culturalInfluence||{};civ.protectedCS=civ.protectedCS||{};civ.tributeCooldown=civ.tributeCooldown||{};civ.heroFallenUntil=civ.heroFallenUntil||0;civ.heroReturnReadyNotified=!!civ.heroReturnReadyNotified;civ.heroLegacy=civ.heroLegacy||null;const oldHeroActive=(o.units||[]).some(u=>u.o===civ.id&&UNITS[u.k]?.hero);if(civ.heroUnlocked===undefined)civ.heroUnlocked=!!(civ.heroLegacy||oldHeroActive);if(civ.heroUnlockPresented===undefined)civ.heroUnlockPresented=!!(civ.heroLegacy||oldHeroActive);}for(const u of o.units){u.xp=u.xp||0;u.promos=u.promos||[];u.heroSkills=u.heroSkills||[];u.heroTraits=u.heroTraits||[];u.heroStats={kills:0,monsterKills:0,citiesCaptured:0,battles:0,damageDealt:0,damageTaken:0,turnsDeployed:0,tilesMoved:0,rangedKills:0,lowHpSurvivals:0,friendlyDefenseActions:0,wildTurns:0,...(u.heroStats||{})};u.attacks=0;u.setup=!!u.setup;u.healUntil=!!u.healUntil;}o.rivers=o.rivers||[];G=o;G._riverSet=null;for(const civ of G.civs)syncHeroUnlockFromHall(civ,G.cities.find(c=>c.o===civ.id&&c.bld?.includes('halllegends'))||null,'completed');ensureLuxuryDiversity(mulberry((G.seed||1)+11337),2);if(!G.rivers.length)generateRivers((G.seed||1)+771);if(!G.naturalWonders.length)seedNaturalWonders(mulberry((G.seed||1)+4815),[]);if(!(G.sites||[]).some(q=>q.kind==='antiquity'))seedAntiquitySites(mulberry((G.seed||1)+9127),4);return true;}catch(e){console.error(e);return false;}}

// ---------- city-state influence ----------
function infStatus(major,cs){const v=G.civs[major].inf[cs]||0;return v>=60?'Allied':v>=30?'Friendly':null;}
function giftGold(major,cs,amt){const civ=civOf(major);if(civ.gold<amt||atWar(major,cs))return false;civ.gold-=amt;civ.inf[cs]=Math.min(100,(civ.inf[cs]||0)+Math.round(amt*.4));recalcCiv(civ);return true;}

function ensureCSQuestState(){G.csQuests=G.csQuests||{};G.nextQuestId=G.nextQuestId||1;for(const civ of G.civs)if(!CIVS[civ.id].cs){ensureCultureState(civ);}}
function csCity(csid){return G.cities.find(c=>c.o===csid);}
function csAlly(csid){let best=null,bv=59;for(const civ of G.civs){if(CIVS[civ.id].cs||CIVS[civ.id].barb||!civ.alive)continue;const v=civ.inf[csid]||0;if(v>bv){bv=v;best=civ.id;}}return best;}
function questDescription(q){if(!q)return 'No active quest.';if(q.type==='lair')return q.target?`Destroy the monster lair near (${q.target.x}, ${q.target.y}).`:'Destroy a monster lair.';if(q.type==='natural')return q.target?`Discover ${NATURAL_WONDERS[q.target]?.n||'a Natural Wonder'}.`:'Discover a Natural Wonder.';if(q.type==='great')return `Generate a ${GP_TYPES[q.target]?.n||'Great Person'}.`;if(q.type==='wonder')return `Complete ${WONDERS[q.target]?.n||'a World Wonder'}.`;if(q.type==='artifact')return 'Excavate an Antiquity Site and recover an Artifact.';return 'Aid this city-state.';}
function generateCSQuest(csid){ensureCSQuestState();const c=csCity(csid);if(!c)return null;const opts=[];const nearby=(G.camps||[]).filter(x=>hdist(c,x)<=18);if(nearby.length)opts.push('lair');const unseen=Object.keys(NATURAL_WONDERS);if(unseen.length)opts.push('natural');opts.push('great','wonder','artifact');const type=opts[Math.floor(Math.random()*opts.length)];let target=null;if(type==='lair'){const a=nearby.sort((a,b)=>hdist(c,a)-hdist(c,b))[0];target=a?{x:a.x,y:a.y,kind:a.kind}:null;}else if(type==='natural')target=unseen[Math.floor(Math.random()*unseen.length)];else if(type==='great')target=['scientist','engineer','merchant','prophet'][Math.floor(Math.random()*4)];else if(type==='wonder'){const av=Object.keys(WONDERS).filter(k=>G.wonders[k]===undefined);target=av.length?av[Math.floor(Math.random()*av.length)]:null;}const q={id:G.nextQuestId++,cs:csid,type,target,reward:CS_QUEST_REWARDS[type]||30,created:G.turn,expires:G.turn+Math.round(40*speedCfg().cost)};G.csQuests[csid]=q;return q;}
function questMatches(q,type,data){if(!q||q.type!==type)return false;if(type==='lair')return !q.target||(data&&data.x===q.target.x&&data.y===q.target.y);if(type==='natural'||type==='great'||type==='wonder')return !q.target||q.target===data;return true;}
function completeCSQuest(major,csid){const q=G.csQuests&&G.csQuests[csid];if(!q)return false;const civ=civOf(major);civ.inf[csid]=Math.min(100,(civ.inf[csid]||0)+q.reward);note(major,`${CIVS[csid].name} quest completed! +${q.reward} influence.`,csCity(csid)||null,'good');if(major===G.player){playSfx('great',.45);queueRealmEvent('City-State Quest Complete',CIVS[csid].ico,`${CIVS[csid].name}: <b>${questDescription(q)}</b><br><span class="small">+${q.reward} influence</span>`);}delete G.csQuests[csid];return true;}
function checkCSQuestEvent(major,type,data){ensureCSQuestState();if(CIVS[major]?.cs||CIVS[major]?.barb)return;for(const civ of G.civs)if(CIVS[civ.id].cs&&civ.alive&&civOf(major).met[civ.id]){const q=G.csQuests[civ.id];if(questMatches(q,type,data))completeCSQuest(major,civ.id);}}
function processCityStateQuests(){ensureCSQuestState();for(const cs of G.civs.filter(c=>c.alive&&CIVS[c.id].cs)){let q=G.csQuests[cs.id];if(q&&G.turn>q.expires){delete G.csQuests[cs.id];q=null;}if(!q&&(G.turn<5||G.turn%8===cs.id%8||Math.random()<.03))generateCSQuest(cs.id);}}
function pledgeProtection(csid){const civ=civOf(G.player);ensureCultureState(civ);if(atWar(G.player,csid))return;civ.protectedCS[csid]={active:true,since:G.turn};civ.inf[csid]=Math.min(100,(civ.inf[csid]||0)+5);toast(`You pledged to protect ${CIVS[csid].name}.`);openDiplo();}
function revokeProtection(csid){const civ=civOf(G.player);ensureCultureState(civ);delete civ.protectedCS[csid];toast(`Protection of ${CIVS[csid].name} revoked.`);openDiplo();}
function csMilitaryPressure(major,csid){const c=csCity(csid);if(!c)return 0;const a=G.units.filter(u=>u.o===major&&!isCiv(u)&&hdist(u,c)<=5).reduce((n,u)=>n+Math.max(1,UNITS[u.k].str||UNITS[u.k].rstr||1),0);const d=G.units.filter(u=>u.o===csid&&!isCiv(u)&&hdist(u,c)<=5).reduce((n,u)=>n+Math.max(1,UNITS[u.k].str||UNITS[u.k].rstr||1),0)+c.str;return a/Math.max(1,d);}
function demandTribute(csid){const civ=civOf(G.player);ensureCultureState(civ);const cd=civ.tributeCooldown[csid]||0,pressure=csMilitaryPressure(G.player,csid);if(G.turn<cd){toast('That city-state recently paid tribute.');return;}if(pressure<.75){toast('Your nearby military is not intimidating enough.');return;}const gold=Math.round((45+pressure*20)*speedCfg().cost);civ.gold+=gold;civ.inf[csid]=Math.max(0,(civ.inf[csid]||0)-25);civ.tributeCooldown[csid]=G.turn+30;note(G.player,`${CIVS[csid].name} paid ${gold} gold in tribute.`,csCity(csid),'good');openDiplo();hud();}

// ---------- monsters / lairs ----------
const BARB=()=>CIVS.findIndex(c=>c.barb);
function lairKindFor(t){if(t.t==='hills'||t.t==='tundra')return Math.random()<.55?'troll':'ogre';if(t.t==='desert')return 'ogre';if(t.f==='forest'||t.f==='jungle')return Math.random()<.72?'goblin':'troll';return G.turn>110&&Math.random()<.18?'wyrm':'goblin';}
function lairReward(kind){const base=(LAIR[kind]||LAIR.goblin).reward,scale=((G&&G.settings&&G.settings.speed)==='quick'?.8:(G&&G.settings&&G.settings.speed)==='epic'?1.4:1);return Math.max(1,Math.round(base*scale));}
function clearLairAt(u,t){if(!u||!t||!t.camp||isBarb(u.o))return false;const B=BARB();if(unitsAt(t.x,t.y).some(q=>q.o===B))return false;const kind=typeof t.camp==='string'?t.camp:'goblin',L=LAIR[kind]||LAIR.goblin,reward=lairReward(kind);t.camp=false;civOf(u.o).gold+=reward;checkCSQuestEvent(u.o,'lair',{x:t.x,y:t.y,kind});G.camps=G.camps.filter(c=>c.x!==t.x||c.y!==t.y);note(u.o,`${L.n} destroyed! +${reward} gold.`,t,'good');if(u.o===G.player)playSfx('lair');fx(t,'LAIR CLEARED +'+reward+'🪙','#ffd166');recalcCiv(civOf(u.o));return true;}
function barbUnitKind(kind){if(kind&&LAIR[kind])return kind;if(G.turn<45)return Math.random()<.7?'goblin':'ogre';if(G.turn<120)return ['goblin','ogre','troll'][Math.floor(Math.random()*3)];return ['ogre','troll','wyrm'][Math.floor(Math.random()*3)];}
function barbManage(){
  const B=BARB();if(B<0||G.turn<8)return;
  G.camps=G.camps.filter(c=>G.tiles[idx(c.x,c.y)].camp);
  for(const c of [...G.camps]){const tile=G.tiles[idx(c.x,c.y)],us=unitsAt(c.x,c.y),kind=c.kind||tile.camp||'goblin';
    if(us.length&&us[0].o!==B){tile.camp=false;const o=us[0].o,reward=lairReward(kind);civOf(o).gold+=reward;checkCSQuestEvent(o,'lair',{x:c.x,y:c.y,kind});note(o,`${(LAIR[kind]||LAIR.goblin).n} destroyed! +${reward} gold.`,c,'good');if(o===G.player)playSfx('lair');fx(tile,'LAIR CLEARED','#ffd166');G.camps=G.camps.filter(q=>q!==c);}
    else if(G.turn-c.last>=(kind==='wyrm'?14:9)&&G.units.filter(u=>u.o===B&&u.lair===c.id).length<(kind==='wyrm'?1:3)){
      c.last=G.turn;const k=barbUnitKind(kind),sp=[tile,...nbrs(c.x,c.y)].find(t=>!T[t.t].water&&!T[t.t].block&&!unitsAt(t.x,t.y).length);
      if(sp){const g=addUnit(k,B,sp.x,sp.y);g.lair=c.id;g.gd=sp===tile;g.fort=g.gd;}}
  }
  const mm=(MONSTER_LEVELS[G.settings?.monsters||'standard']||MONSTER_LEVELS.standard).mult,cap=Math.max(1,Math.round((3+Math.floor(G.turn/55))*mm));
  if(G.camps.length<cap&&G.turn%4===0&&Math.random()<Math.min(.95,.68*mm)){
    for(let i=0;i<55;i++){const t=G.tiles[Math.floor(Math.random()*G.tiles.length)];
      if(T[t.t].water||T[t.t].block||t.own>=0||t.city!=null||t.site||unitsAt(t.x,t.y).length)continue;
      if(G.cities.some(c=>hdist(c,t)<6)||G.camps.some(c=>hdist(c,t)<8)||G.vis[G.player][idx(t.x,t.y)]===2)continue;
      const kind=lairKindFor(t),id=G.nid++;t.camp=kind;const camp={id,x:t.x,y:t.y,last:G.turn,kind};G.camps.push(camp);
      const g=addUnit(barbUnitKind(kind),B,t.x,t.y);g.lair=id;g.gd=true;g.fort=true;
      if(G.vis[G.player][idx(t.x,t.y)])note(G.player,`${LAIR[kind].n} has appeared!`,t,'bad');break;}}
}

// ---------- religion ----------
const relCost=()=>Math.round((200+G.religions.length*40)*speedCfg().cost);
function canFoundReligion(civ){return !!civ.pan&&!civ.rel&&G.religions.length<Math.min(8,MAJORS.length)&&civ.faith>=relCost()&&civ.cities>0&&!CIVS[civ.id].cs&&!CIVS[civ.id].barb;}
function adoptPantheon(civ,k){if(civ.pan||civ.faith<10)return false;civ.pan=k;civ.faith-=10;recalcCiv(civ);note(civ.id,`Pantheon adopted: ${PANTHEON[k].n}.`,null,'good');return true;}
function foundReligion(civ,fk,bk){
  if(!canFoundReligion(civ))return false;civ.faith-=relCost();
  civ.rel={name:RELIGION_NAMES[civ.id]||('Faith of '+CIVS[civ.id].name),founder:fk,follower:bk};G.religions.push(civ.id);
  for(const c of G.cities.filter(c=>c.o===civ.id))c.rel=civ.id;
  for(const o of G.civs)note(o.id,`${CIVS[civ.id].name} founded the ${civ.rel.name}!`,null,civ.id===G.player?'good':'');
  recalcCiv(civ);return true;
}
function missionaryCost(civ){return Math.round((100+20*G.units.filter(u=>u.o===civ.id&&u.k==='missionary').length)*speedCfg().cost);}
function buyMissionary(civ,c){const cost=missionaryCost(civ);if(!civ.rel||civ.faith<cost)return false;const sp=spawnSpot(c,'missionary');if(!sp)return false;civ.faith-=cost;addUnit('missionary',civ.id,sp.x,sp.y);return true;}
function spreadTarget(u){if(!civOf(u.o).rel)return null;let best=null;for(const c of G.cities)if(hdist(u,c)<=1&&c.rel!==u.o&&!(atWar(u.o,c.o)))best=c;return best;}
function spreadFaith(u){const c=spreadTarget(u),R=civOf(u.o).rel;if(!c||!R)return false;c.rel=u.o;note(u.o,`${c.name} now follows the ${R.name}!`,c,'good');if(c.o===G.player&&u.o!==G.player)note(G.player,`${c.name} was converted to the ${civOf(u.o).rel.name}.`,c);removeUnit(u);recalcCiv(civOf(c.o));recalcCiv(civOf(u.o));return true;}
function spreadReligion(){
  for(const c of G.cities)if(c.rel!=null){for(const o of G.cities){if(o===c||o.rel===c.rel||hdist(o,c)>8)continue;
    if(Math.random()<(o.rel==null?.03:.006)){o.rel=c.rel;if(o.o===G.player||c.rel===G.player)note(G.player,`${o.name} adopted the ${civOf(c.rel).rel.name}.`,o);}}}
}

</script><script>
'use strict';
// ===== Computer-controlled realms =====
const AI_TECH_PRIORITY=['agri','mining','husb','bronze','writing','archery','masonry','currency','wheel','smith','constr','phil','riding','math','educ','steel','engin','bank','mach','chival','sorc','dragon','ascend','sail'];
const AI_POL_ORDER=['t1','l1','c1','t2','l2','c2','h1','t3','l3','c3','h2','h3'];
const AI_BLD_ORDER=['potter','workshop','storehouse','meetinghall','herbalist','hunting_lodge','lumber_guild','monument','watchpost','shrine','training_yard','caravanserai','harbor','granary','library','market','temple','smithy','walls','colosseum','univ','bank','castle','tower'];

function aiTurn(civ){
  if(!civ.alive)return;
  if(CIVS[civ.id].barb)return barbTurn(civ);
  if(CIVS[civ.id].cs)return csTurn(civ);
  recalcCiv(civ);
  if(!civ.res){const av=techAvail(civ);av.sort((a,b)=>AI_TECH_PRIORITY.indexOf(a)-AI_TECH_PRIORITY.indexOf(b));if(av.length)civ.res=av[0];}
  for(const p of AI_POL_ORDER){if(!civ.pols.includes(p)&&(!POLICIES[p].req||civ.pols.includes(POLICIES[p].req))){if(civ.cul>=polCost(civ))adoptPolicy(civ,p);break;}}
  aiDiplomacy(civ);aiManageTradeRoutes(civ);aiAssignSpy(civ);aiUpgradeUnits(civ);
  for(const c of G.cities.filter(c=>c.o===civ.id)){if(c.resistance||c.razing)continue;if(!c.q||!canBuild(c,c.q))aiProduce(c,civ);
    if(c.q&&civ.gold>buyCost(c)*1.6+60&&c.q.k!=='won')buy(c);}
  if(civ.rel&&civ.faith>=missionaryCost(civ)&&G.units.filter(u=>u.o===civ.id&&u.k==='missionary').length<2&&G.cities.some(c=>c.rel!==civ.id)){const cap=G.cities.find(c=>c.o===civ.id);if(cap)buyMissionary(civ,cap);}
  const mine=G.units.filter(u=>u.o===civ.id);
  civ.sites=null;
  for(const u of mine){if(!G.units.includes(u))continue;
    try{
      if(u.k==='settler')aiSettler(u,civ);else if(u.k==='worker')aiWorker(u,civ);
      else if(UNITS[u.k].great)aiGreatPerson(u,civ);else if(u.k==='scout')aiScout(u,civ);else if(u.k==='missionary')aiMissionary(u,civ);else aiMilitary(u,civ);
    }catch(e){console.error('unit ai',u.k,e);}}
}
function aiUpgradeUnits(civ){let n=0;for(const u of G.units.filter(u=>u.o===civ.id)){if(n>=2)break;const cost=upgradeCost(u);if(cost&&civ.gold>cost+90&&canUpgradeUnit(u)){upgradeUnit(u,true);n++;}}}
function aiGreatPerson(u,civ){const type=UNITS[u.k].great;if(type==='general'){const army=G.units.filter(q=>q.o===civ.id&&!isCiv(q));if(!army.length){u.sleep=true;return;}army.sort((a,b)=>UNITS[b.k].str-UNITS[a.k].str);const a=army[0];if(hdist(u,a)>2)gotoTile(u,a.x,a.y);else u.sleep=true;return;}if(type==='engineer'){let c=G.cities.find(c=>c.o===civ.id&&c.q&&c.q.k==='won')||G.cities.find(c=>c.o===civ.id&&c.q);if(!c){u.sleep=true;return;}if(u.x===c.x&&u.y===c.y)useGreatPerson(u,true);else gotoTile(u,c.x,c.y);return;}useGreatPerson(u,true);}
function aiDiplomacy(civ){
  const others=G.civs.filter(o=>o.alive&&o.id!==civ.id&&!CIVS[o.id].barb&&!CIVS[o.id].cs);
  for(const o of others){
    if(atWar(civ.id,o.id)){const dur=G.turn-civ.war[o.id];if(dur>=10&&aiWantsPeace(civ,o)){if(o.id===G.player)queuePeaceOffer(civ.id);else makePeace(civ.id,o.id);}}
    else if(G.turn>35&&civ.cities&&!others.some(q=>atWar(civ.id,q.id))){
      if(o.id!==G.player&&canResearchAgreement(civ.id,o.id)&&Math.random()<.008)startResearchAgreement(civ.id,o.id,true);
      if(o.id!==G.player&&canDefensivePact(civ.id,o.id)&&Math.random()<.004)startDefensivePact(civ.id,o.id,true);
      const near=G.cities.some(c=>c.o===o.id&&G.cities.some(m=>m.o===civ.id&&hdist(c,m)<22));
      const cool=civ.peace&&civ.peace[o.id]&&G.turn-civ.peace[o.id]<25;
      if(near&&!cool&&score(civ)>score(o)*.85&&Math.random()<.03*aiPersonality(civ.id).agg){declareWar(civ.id,o.id);}
    }
  }
}
function aiWantsPeace(ai,other){const dur=G.turn-(ai.war[other.id]||G.turn),p=aiPersonality(ai.id);return dur>=8&&(score(ai)<score(other)*(1.18+.07*p.peace)||Math.random()<.15*p.peace);}

function aiSites(civ){
  if(civ.sites)return civ.sites;
  const mine=G.cities.filter(c=>c.o===civ.id),out=[];
  for(const t of G.tiles){
    if(!canFound(t)||(t.own>=0&&t.own!==civ.id))continue;
    const ref=mine.length?mine:[civ.start];if(!ref.some(r=>hdist(r,t)<=11))continue;
    let s=0;for(const q of tilesIn(t.x,t.y,2)){const y=tileYield(q,civ.id);s+=y.f+y.p*.6+y.g*.5+(q.r?2:0);if(T[q.t].water)s-=.5;if(q.own>=0&&q.own!==civ.id)s-=3;}
    if(t.t==='hills')s+=3;out.push({t,s});
  }
  out.sort((a,b)=>b.s-a.s);civ.sites=out.slice(0,60);return civ.sites;
}
function aiSettler(u,civ){
  const here=G.tiles[idx(u.x,u.y)];
  if(!G.cities.some(c=>c.o===civ.id)){if(canFound(here)){foundCity(u);return;}}
  const taken=new Set(G.units.filter(q=>q!==u&&q.k==='settler'&&q.o===civ.id&&q.target!=null).map(q=>q.target));
  let tgt=u.target!=null?G.tiles[u.target]:null;
  if(!tgt||!canFound(tgt)){
    tgt=null;let best=-1e9;
    for(const {t,s} of aiSites(civ)){if(taken.has(idx(t.x,t.y)))continue;const d=hdist(u,t);const v=s-d*.9;if(v>best){best=v;tgt=t;}}
    u.target=tgt?idx(tgt.x,tgt.y):null;
  }
  if(!tgt)return;
  if(tgt===here){foundCity(u);return;}
  if(!u.path||!u.path.length)if(!gotoTile(u,tgt.x,tgt.y)){u.target=null;return;}
  runPath(u);
  if(u.x===tgt.x&&u.y===tgt.y&&u.mp>0)foundCity(u);
}
function aiWorker(u,civ){
  if(u.job){u.wt=idx(u.x,u.y);u.sleep=false;return;}
  u.sleep=false;const here=G.tiles[idx(u.x,u.y)];
  if(here.own===civ.id&&startJob(u)){u.wt=idx(u.x,u.y);return;}
  if(u.path&&u.path.length){runPath(u);const t2=G.tiles[idx(u.x,u.y)];if(t2.own===civ.id&&startJob(u)){u.wt=idx(u.x,u.y);return;}if(u.path&&u.path.length)return;}
  const busy=new Set(G.units.filter(q=>q.k==='worker'&&q!==u&&q.o===civ.id).map(q=>q.job?idx(q.x,q.y):q.wt).filter(v=>v!=null));
  let best=null,bs=-1e9;
  for(const c of G.cities.filter(c=>c.o===civ.id))for(const t of tilesIn(c.x,c.y,3)){
    if(t.own!==civ.id||busy.has(idx(t.x,t.y)))continue;const imp=bestImprovement(t,civ);if(!imp)continue;if(unitsAt(t.x,t.y).some(q=>q!==u&&isCiv(q)))continue;
    const y=tileYield(t,civ.id),score=(t.worked!=null?6:0)+(t.r?7:0)+y.f*.8+y.p*.9+y.g*.55-hdist(u,t)*.6;if(score>bs){bs=score;best=t;}}
  if(best){u.wt=idx(best.x,best.y);if(best===here){if(startJob(u))return;}else if(gotoTile(u,best.x,best.y)){const t2=G.tiles[idx(u.x,u.y)];if(t2===best&&startJob(u))u.wt=idx(best.x,best.y);return;}}
  u.wt=null;
  if(hasTech(civ,'wheel')&&here.own===civ.id&&!here.road&&!T[here.t].water&&startJob(u,'road')){u.wt=idx(here.x,here.y);return;}
  u.sleep=true;
}
function aiScout(u,civ){
  if(u.path&&u.path.length){runPath(u);if(u.path||u.mp<=0)return;}
  for(let i=0;i<12;i++){
    const x=Math.floor(Math.random()*G.W),y=Math.floor(Math.random()*G.H),t=tileAt(x,y);
    if(!t||T[t.t].water||T[t.t].block||hdist(u,t)<6)continue;
    if(gotoTile(u,x,y))return;
  }
}
function bestUnit(civ,cls){
  let b=null;for(const k in UNITS){const d=UNITS[k];if(d.monster||d.hero||!cls.includes(d.cls)||k==='scout'||!unitReqOK(civ,k))continue;const v=(d.rstr||d.str)*(d.cls==='mounted'?.9:1);if(!b||v>(UNITS[b].rstr||UNITS[b].str)*(UNITS[b].cls==='mounted'?.9:1))b=k;}
  return b;
}
function aiProduce(c,civ){
  const mine=G.units.filter(u=>u.o===civ.id),cities=G.cities.filter(q=>q.o===civ.id);
  const war=G.civs.some(o=>atWar(civ.id,o.id)&&o.alive&&!CIVS[o.id].barb&&!CIVS[o.id].cs);
  const set=q=>{c.q=q;};
  const nSett=mine.filter(u=>u.k==='settler').length+cities.filter(q=>q.q&&q.q.id==='settler').length;
  const hk=heroUnitForCiv(civ.id);if(hk&&cities[0]===c&&!heroUnlockedForCiv(civ)&&hasTech(civ,'steel')&&canBuild(c,{k:'bld',id:'halllegends'}))return set({k:'bld',id:'halllegends'});if(hk&&cities[0]===c&&canBuild(c,{k:'unit',id:hk}))return set({k:'unit',id:hk});
  const mil=mine.filter(u=>!isCiv(u)&&u.k!=='scout');
  const inCity=unitsAt(c.x,c.y).some(u=>!isCiv(u));
  if(!inCity&&!c.q){const d=bestUnit(civ,['melee','ranged']);if(d)return set({k:'unit',id:d});}
  if(!war&&cities.length+nSett<Math.min(7,3+Math.floor(G.turn/35))&&c.pop>=2&&aiSites(civ).length&&nSett<2&&canBuild(c,{k:'unit',id:'settler'}))return set({k:'unit',id:'settler'});
  if(mine.filter(u=>u.k==='worker').length<cities.length+(G.turn>60?1:0)&&c.pop>=1)return set({k:'unit',id:'worker'});
  if(mine.filter(u=>u.k==='scout').length<1&&G.turn<30&&cities.indexOf(c)===0)return set({k:'unit',id:'scout'});
  if(civ.y.hap<3&&canBuild(c,{k:'bld',id:'colosseum'}))return set({k:'bld',id:'colosseum'});
  if(war&&mil.length<cities.length*3+4){const d=bestUnit(civ,Math.random()<.4?['ranged','siege']:['melee','mounted']);if(d)return set({k:'unit',id:d});}
  for(const base of AI_BLD_ORDER){if(base==='walls'&&!war)continue;const b=factionBuildingFor(civ.id,base);if(canBuild(c,{k:'bld',id:b}))return set({k:'bld',id:b});}
  if(c.yl.p>=4){const ws=Object.keys(WONDERS).filter(w=>canBuild(c,{k:'won',id:w})&&!cities.some(q=>q.q&&q.q.id===w));if(ws.length&&Math.random()<.5)return set({k:'won',id:ws[0]});}
  if(war&&isCoastal(c)&&mine.filter(u=>UNITS[u.k].cls==='naval').length<2&&Math.random()<.3){const d=['warship','galley'].find(k=>canBuild(c,{k:'unit',id:k}));if(d)return set({k:'unit',id:d});}
  if(mil.length<cities.length*2+Math.floor(G.turn/25)){const d=bestUnit(civ,['melee','ranged','mounted','siege','flying']);if(d)return set({k:'unit',id:d});}
  const d=bestUnit(civ,['ranged']);if(d)return set({k:'unit',id:d});
  set({k:'unit',id:'warrior'});
}
function aiMilitary(u,civ){
  const tile=G.tiles[idx(u.x,u.y)];
  const hostile=G.civs.filter(o=>o.alive&&atWar(civ.id,o.id)).map(o=>o.id);
  if(u.hp<42){const safe=G.cities.filter(c=>c.o===civ.id).sort((a,b)=>hdist(u,a)-hdist(u,b))[0];if(safe){if(u.x===safe.x&&u.y===safe.y){u.fort=true;u.healUntil=true;u.mp=0;}else gotoTile(u,safe.x,safe.y);return;}}
  const enemies=hostile.filter(i=>!CIVS[i].barb&&!CIVS[i].cs);
  // garrison duty
  if(!u.gar||!cityOf(u.gar)||cityOf(u.gar).o!==civ.id){u.gar=null;
    const c=G.cities.find(c=>c.o===civ.id&&!G.units.some(q=>q!==u&&q.gar===c.id));
    if(c&&!isCiv(u)&&u.k!=='dragon'&&UNITS[u.k].cls!=='naval')u.gar=c.id;}
  const home=u.gar?cityOf(u.gar):null;
  // fight first
  if(hostile.length){if(UNITS[u.k].cls==='siege'&&!u.setup&&u.mp>=1){const inRange=G.units.some(q=>hostile.includes(q.o)&&hdist(u,q)<=unitRange(u))||G.cities.some(c=>hostile.includes(c.o)&&hdist(u,c)<=unitRange(u));if(inRange){u.setup=true;u.mp=Math.max(0,u.mp-1);}}
    const near=[];
    for(const q of G.units)if(hostile.includes(q.o)&&hdist(u,q)<=(unitRange(u)))near.push(q);
    for(const c of G.cities)if(hostile.includes(c.o)&&hdist(u,c)<=(unitRange(u)))near.push(c);
    let tgt=null,bv=-1e9;
    for(const q of near){const t=G.tiles[idx(q.x,q.y)];if(!canAttackTile(u,t))continue;
      const isC=q.pop!==undefined;const A=unitStrength(u,UNITS[u.k].rstr?'ranged':'attack');
      const D=isC?q.str:unitStrength(bestDefender(q.x,q.y)||q,'defend',u,t);
      const ok=UNITS[u.k].rstr||A>=D-2||(isC&&q.hp<50);const v=(A-D)-(isC?0:q.hp/40)+(isC?2:0);
      if(ok&&u.hp>40&&v>bv){bv=v;tgt=t;}}
    if(tgt){attack(u,tgt);return;}
  }
  if(home&&(!enemies.length||G.cities.filter(c=>c.o===civ.id).length===1||UNITS[u.k].cls==='civ')){
    if(u.x!==home.x||u.y!==home.y){if(!u.path)gotoTile(u,home.x,home.y);else runPath(u);}
    else u.fort=true;return;
  }
  if(enemies.length&&u.hp>60){
    // pick target: nearest enemy city, else unit
    let tgt=null,bd=1e9;
    for(const c of G.cities)if(enemies.includes(c.o)){const d=hdist(u,c);if(d<bd){bd=d;tgt=c;}}
    if(tgt){
      if(u.hp<100&&hdist(u,tgt)>4&&u.hp<55){u.fort=true;return;}
      if(!u.path||!u.path.length||u.tgt!==tgt.id){u.tgt=tgt.id;
        let best=null,bl=1e9;const want=(UNITS[u.k].rstr||UNITS[u.k].cls==='siege')?Math.max(2,unitRange(u)):1;
