<script>
'use strict';
// ===== HUD, panels, modals and input =====
const $=id=>document.getElementById(id);
let pickCiv=0,pickDifficulty='prince',pickSpeed='standard',pickMapType='continents',pickMapSize='standard',pickCityStates=4,pickWorldAge='standard',pickTemperature='temperate',pickRainfall='normal',pickSeaLevel='medium',pickResources='standard',pickMonsters='standard',pickNaturalWonders='standard',pickSeed='',setupAdvanced=false,lastHoverKey='',running=false;
let setupSlots=[{type:'human',civ:0},{type:'ai',civ:1},{type:'ai',civ:2},{type:'ai',civ:3},{type:'ai',civ:4},{type:'closed',civ:'random'},{type:'closed',civ:'random'},{type:'closed',civ:'random'}];
function setHTML(el,h){if(el._h!==h){el._h=h;el.innerHTML=h;}}
const fmt=n=>(n>=0?'+':'')+(Math.round(n*10)/10);
const selUnit=()=>G&&G.sel&&G.sel.type==='unit'?unitOf(G.sel.id):null;

// ---------- start screen ----------
function optList(obj,val){return Object.entries(obj).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v.n}</option>`).join('');}
function selectedLeader(){const v=setupSlots[0]?.civ;return Number.isInteger(v)?CIVS[v]:null;}
function mapTypeDesc(){return (MAP_TYPES[pickMapType]||MAP_TYPES.continents).d;}
function setupActiveSlots(){return setupSlots.filter(s=>s.type!=='closed');}
function setupHumanCount(){return setupSlots.filter(s=>s.type==='human').length;}
function setMainCiv(v){setupSlots[0].civ=v==='random'?'random':+v;pickCiv=Number.isInteger(setupSlots[0].civ)?setupSlots[0].civ:0;showStart();}
function setSlotType(i,v){if(i===0){setupSlots[0].type='human';showStart();return;}setupSlots[i].type=v;if(!setupSlots.some(s=>s.type==='human'))setupSlots[0].type='human';showStart();}
function setSlotCiv(i,v){const old=setupSlots[i].civ,nv=v==='random'?'random':+v;setupSlots[i].civ=nv;if(Number.isInteger(nv))for(let j=0;j<setupSlots.length;j++)if(j!==i&&setupSlots[j].type!=='closed'&&setupSlots[j].civ===nv)setupSlots[j].civ=Number.isInteger(old)?old:'random';if(i===0&&Number.isInteger(nv))pickCiv=nv;showStart();}
function resolveSetupPlayers(seed){
  const rnd=mulberry((seed||Date.now())+7711),active=setupSlots.filter(s=>s.type!=='closed').map(s=>({...s})),used=new Set(active.filter(s=>Number.isInteger(s.civ)).map(s=>s.civ)),avail=MAJORS.map(c=>c.id).filter(id=>!used.has(id));avail.sort(()=>rnd()-.5);
  for(const s of active)if(!Number.isInteger(s.civ)){s.civ=avail.shift();if(s.civ==null)s.type='closed';}
  return active.filter(s=>s.type!=='closed'&&Number.isInteger(s.civ));
}
function randomizeSetup(){const rnd=mulberry(Date.now()&0xffffffff),ids=MAJORS.map(c=>c.id).sort(()=>rnd()-.5);setupSlots.forEach((s,i)=>{if(s.type!=='closed')s.civ=ids[i]??'random';});setupSlots[0].type='human';pickCiv=Number.isInteger(setupSlots[0].civ)?setupSlots[0].civ:0;const types=['continents','pangaea','archipelago','inlandsea','highlands','lakes'];pickMapType=types[Math.floor(rnd()*types.length)];pickSeed=String(Math.floor(rnd()*999999999));showStart();}
function setupSummaryHTML(){const leader=selectedLeader(),mt=MAP_TYPES[pickMapType]||MAP_TYPES.continents,ms=MAP_SIZES[pickMapSize]||MAP_SIZES.standard;return `<div class="setupSummary"><h3>Game Summary</h3><div class="summaryLine"><span>Realm</span><b>${leader?leader.name:'Random Civilization'}</b></div><div class="summaryLine"><span>World</span><b>${mt.n} · ${ms.n}</b></div><div class="summaryLine"><span>Pace</span><b>${GAME_SPEEDS[pickSpeed].n}</b></div><div class="summaryLine"><span>Difficulty</span><b>${DIFFICULTIES[pickDifficulty].n}</b></div><div class="summaryLine"><span>Players</span><b>${setupActiveSlots().length} realms · ${setupHumanCount()} human</b></div><div class="summaryLine"><span>City-States</span><b>${pickCityStates}</b></div></div>`;}
function factionUniqueSummary(id){const us=Object.entries(UNITS).filter(([k,d])=>d.uniqueCiv===id),bs=Object.entries(BLD).filter(([k,d])=>d.uniqueCiv===id);if(!us.length&&!bs.length)return '';return `<br><span style="color:#b9d6ef">Unique: ${us.map(([k,d])=>d.n).join(', ')}${us.length&&bs.length?' · ':''}${bs.map(([k,d])=>d.n).join(', ')}</span>`;}
function mainSetupHTML(){
  const leader=selectedLeader(),art=leader?`assets/factions/${FACTION_ART_NAMES[leader.id]}.jpg`:'';
  return `<div class="setupBody"><div class="setupLeft"><div class="setupLeader"><div class="setupPortrait" style="${art?`background-image:url('${art}')`:''}">${leader?'':'❓'}</div><div><h2>${leader?`${leader.ico} ${leader.name}`:'Random Leader & Civilization'}</h2><select onchange="setMainCiv(this.value)"><option value="random" ${!Number.isInteger(setupSlots[0].civ)?'selected':''}>Random Leader — Random Civilization</option>${MAJORS.map(c=>`<option value="${c.id}" ${setupSlots[0].civ===c.id?'selected':''}>${c.name} — ${c.leader}</option>`).join('')}</select><div class="trait">${leader?`${leader.race} · ${leader.trait}<br><span style="color:#a9c9e8">AI Personality: ${aiPersonality(leader.id).n}</span><br><span style="color:#e8cf8a">★ Faction Hero: ${UNITS[heroUnitForCiv(leader.id)]?.n||'—'} — build Hall of Legends after Steelcraft</span>${factionUniqueSummary(leader.id)}`:'A civilization will be chosen when the world is created.'}</div></div></div><div class="setupRows"><div class="setupRow"><div class="setupIcon">${MAP_TYPES[pickMapType].ico}</div><div><label>Map Type: ${MAP_TYPES[pickMapType].n}</label><select onchange="pickMapType=this.value;showStart()">${optList(MAP_TYPES,pickMapType)}</select><div class="setupDesc">${mapTypeDesc()}</div></div></div><div class="setupRow"><div class="setupIcon">⬢</div><div><label>Map Size: ${MAP_SIZES[pickMapSize].n}</label><select onchange="pickMapSize=this.value;showStart()">${optList(MAP_SIZES,pickMapSize)}</select><div class="setupDesc">${MAP_SIZES[pickMapSize].d} · ${MAP_SIZES[pickMapSize].W}×${MAP_SIZES[pickMapSize].H} hex field · recommended up to ${MAP_SIZES[pickMapSize].recommended} major realms.</div></div></div><div class="setupRow"><div class="setupIcon">⚔️</div><div><label>Difficulty Level: ${DIFFICULTIES[pickDifficulty].n}</label><select onchange="pickDifficulty=this.value;showStart()">${optList(DIFFICULTIES,pickDifficulty)}</select><div class="setupDesc">${DIFFICULTIES[pickDifficulty].d}</div></div></div><div class="setupRow"><div class="setupIcon">🕰️</div><div><label>Game Pace: ${GAME_SPEEDS[pickSpeed].n}</label><select onchange="pickSpeed=this.value;showStart()">${optList(GAME_SPEEDS,pickSpeed)}</select><div class="setupDesc">${GAME_SPEEDS[pickSpeed].d} · score victory at turn ${GAME_SPEEDS[pickSpeed].maxTurn}.</div></div></div></div></div><div class="setupSide"><div class="setupSideArt" style="${art?`background-image:url('${art}')`:''}"></div><div class="setupSideShade"></div><div class="setupSideContent"><h2 style="color:#f3e7bd;margin:2px 0 6px">Shape the Next Age</h2><div class="setupDesc">Choose a procedural world style or one of the repeatable preset maps, then refine every realm and world condition in Advanced Setup.</div><div style="margin-top:16px" class="small"><b style="color:#f0d786">V5.6.7 TERRAIN ART OVERHAUL</b><br>This pass overhauls terrain identity, biome readability, forests, jungles, hills, mountains, and core world presentation while preserving the exact working hex geometry, picking, movement coordinates, camera rules, faction art, and gameplay systems from V5.6.4.</div>${setupSummaryHTML()}</div></div></div>`;
}
function advancedSetupHTML(){return `<div class="advancedWrap"><div class="advancedGrid"><div class="advPanel"><h3>Realm & Player Slots</h3><div class="setupHint">Ten major factions are available. Up to eight major-realm slots can be opened for AI or local-hotseat players.</div>${setupSlots.map((sl,i)=>`<div class="playerSlot"><div class="slotNum">${i+1}</div><select onchange="setSlotType(${i},this.value)" ${i===0?'disabled title="Primary human player"':''}><option value="human" ${sl.type==='human'?'selected':''}>Human</option>${i===0?'':`<option value="ai" ${sl.type==='ai'?'selected':''}>AI</option><option value="closed" ${sl.type==='closed'?'selected':''}>Closed</option>`}</select><select onchange="setSlotCiv(${i},this.value)" ${sl.type==='closed'?'disabled':''}><option value="random" ${!Number.isInteger(sl.civ)?'selected':''}>Random Civilization</option>${MAJORS.map(c=>`<option value="${c.id}" ${sl.civ===c.id?'selected':''}>${c.ico} ${c.name} — ${c.race}</option>`).join('')}</select></div>`).join('')}<div class="setupHint"><span class="hotseatTag">LOCAL HOTSEAT</span> Multiple Human slots are turn-based on the same device. Between human turns the game presents a handoff screen before revealing the next realm.</div></div><div class="advPanel"><h3>World Conditions</h3><div class="advOpts"><div class="advOpt"><label>CITY-STATES</label><select onchange="pickCityStates=+this.value;showStart()">${[0,1,2,3,4].map(n=>`<option value="${n}" ${pickCityStates===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="advOpt"><label>WORLD AGE</label><select onchange="pickWorldAge=this.value;showStart()">${optList(WORLD_AGES,pickWorldAge)}</select></div><div class="advOpt"><label>TEMPERATURE</label><select onchange="pickTemperature=this.value;showStart()">${optList(TEMPERATURES,pickTemperature)}</select></div><div class="advOpt"><label>RAINFALL</label><select onchange="pickRainfall=this.value;showStart()">${optList(RAIN_LEVELS,pickRainfall)}</select></div><div class="advOpt"><label>SEA LEVEL</label><select onchange="pickSeaLevel=this.value;showStart()">${optList(SEA_LEVELS,pickSeaLevel)}</select></div><div class="advOpt"><label>RESOURCES</label><select onchange="pickResources=this.value;showStart()">${optList(RESOURCE_LEVELS,pickResources)}</select></div><div class="advOpt"><label>MONSTER LAIRS</label><select onchange="pickMonsters=this.value;showStart()">${optList(MONSTER_LEVELS,pickMonsters)}</select></div><div class="advOpt"><label>NATURAL WONDERS</label><select onchange="pickNaturalWonders=this.value;showStart()">${optList(WONDER_LEVELS,pickNaturalWonders)}</select></div><div class="advOpt" style="grid-column:1/-1"><label>WORLD SEED</label><input value="${pickSeed}" placeholder="Blank = random seed" oninput="pickSeed=this.value.replace(/[^0-9-]/g,'')"></div></div><div class="setupHint">World Age affects hills and mountains. Temperature and Rainfall alter biomes. Sea Level changes land/water balance. Resource and monster settings change actual spawning density.</div>${setupSummaryHTML()}</div></div></div>`;}
function showStart(){
  const s=$('start');s.style.display='flex';const hasSave=(()=>{try{return !!localStorage.getItem('aethermoor_save2')}catch(e){return false}})();
  s.innerHTML=`<div class="setupFrame"><div class="setupTitle">${setupAdvanced?'ADVANCED SETUP':'SET UP GAME'}</div>${setupAdvanced?advancedSetupHTML():mainSetupHTML()}<div class="setupFooter"><div class="group"><button onclick="${setupAdvanced?'setupAdvanced=false;showStart()':'randomizeSetup()'}">${setupAdvanced?'← Back':'🎲 Randomize'}</button>${!setupAdvanced&&hasSave?'<button onclick="continueGame()">Continue Game</button>':''}</div><div class="group">${!setupAdvanced?'<button onclick="setupAdvanced=true;showStart()">Advanced Setup</button>':''}<button class="startBtn" onclick="beginGame()">Start Game</button></div></div></div>`;
}
function beginGame(){
  const baseSeed=pickSeed!==''&&Number.isFinite(+pickSeed)?Math.abs(Math.trunc(+pickSeed)):Math.floor(Math.random()*1e9),players=resolveSetupPlayers(baseSeed);if(!players.length){toast('Open at least one realm slot.');return;}if(!players.some(p=>p.type==='human'))players[0].type='human';const human=players.find(p=>p.type==='human');
  const chosenSeed=(MAP_TYPES[pickMapType]?.fixedSeed)||baseSeed;
  newGame(human.civ,chosenSeed,{difficulty:pickDifficulty,speed:pickSpeed,mapType:pickMapType,mapSize:pickMapSize,cityStates:pickCityStates,worldAge:pickWorldAge,temperature:pickTemperature,rainfall:pickRainfall,seaLevel:pickSeaLevel,resources:pickResources,monsters:pickMonsters,naturalWonders:pickNaturalWonders,players});startPlay();
}
function continueGame(){if(loadGame())startPlay(true);}
function startPlay(loaded){
  unlockAudio();$('start').style.display='none';G.sel=null;spriteCache.clear();G.camByPlayer=G.camByPlayer||{};
  cam.z=1;const restored=loaded&&restoreHumanCamera(G.player),u=G.units.find(u=>u.o===G.player&&u.k==='settler')||G.units.find(u=>u.o===G.player);
  if(!restored){if(u){centerOn(u.x,u.y);if(!loaded)selectUnit(u);}else{const c=G.cities.find(c=>c.o===G.player);if(c)centerOn(c.x,c.y);}}
  rememberHumanCamera(G.player);if(typeof threeWorldRebuild==='function')threeWorldRebuild(true);banner(loaded?`Turn ${G.turn}`:CIVS[G.player].name);running=true;
  refreshMusic(true);if(!loaded){G.needTech=true;openTech(true);}
}
function banner(t){const b=$('banner');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
function recenterRealm(){if(!G)return;const u=selUnit();if(u){centerOn(u.x,u.y);return;}const cap=G.cities.find(c=>c.o===G.player&&c.cap)||G.cities.find(c=>c.o===G.player);if(cap){centerOn(cap.x,cap.y);return;}const any=G.units.find(u=>u.o===G.player);if(any)centerOn(any.x,any.y);}


// ---------- selection ----------
function selectUnit(u){closeCity();rangedAttackMode=false;G.sel={type:'unit',id:u.id};refreshSel();}
function selectCity(c){G.sel={type:'city',id:c.id};reach=null;targets=null;selPath=null;cityBombardMode=false;cityTileBuyMode=false;rangedAttackMode=false;openCity(c);}
function clearSel(){G.sel=null;reach=null;targets=null;selPath=null;rangedAttackMode=false;closeCity();hud();}
function refreshSel(){
  reach=null;targets=null;selPath=null;const u=selUnit();
  if(u&&u.o===G.player&&u.mp>0&&!isCiv(u)||u&&isCiv(u)&&u.mp>0){reach=reachable(u);}
  if(u&&!isCiv(u)&&u.mp>0){const ranged=!!UNITS[u.k].rstr&&unitRange(u)>1;if(!ranged||rangedAttackMode){targets=[];for(const t of tilesIn(u.x,u.y,unitRange(u)))if(G.vis[G.player][idx(t.x,t.y)]===2&&canAttackTile(u,t))targets.push(t);}}
  hud();
}
function needsOrders(u){
  // Fortified units deliberately stay out of Next Unit rotation on every turn until the player unfortifies
  // or moves them. Sleep/heal/work/automation states likewise suppress order prompts.
  return u.o===G.player&&u.mp>0&&!u.fort&&!u.sleep&&!u.healUntil&&!u.job&&!u.auto&&!(u.path&&u.path.length)&&u.skipT!==G.turn;
}
function nextAction(){
  if(G.winner)return showWin();
  if(G.needPan||G.needRel){openFaith();return;}
  const u=G.units.find(needsOrders);
  if(u){centerOn(u.x,u.y);selectUnit(u);return;}
  const c=G.cities.find(c=>c.o===G.player&&!c.q&&!c.puppet&&!c.razing&&!c.resistance);
  if(c){centerOn(c.x,c.y);selectCity(c);return;}
  if(G.needTech&&techAvail(civOf(G.player)).length){G.needTech=false;openTech();return;}
  doEndTurn();
}
function doEndTurn(){
  closeCity();G.sel=null;reach=targets=selPath=null;rememberHumanCamera(G.player);$('next').disabled=true;
  setTimeout(()=>{const advanced=endTurn();$('next').disabled=false;banner(advanced?'Turn '+G.turn:CIVS[G.player].name+' — Your Turn');miniDirty=true;
    if(G.winner){showWin();return;}if(advanced&&G.turn%10===0)saveGame();if((G.humans||[]).filter(id=>G.civs[id]?.alive).length>1){showHotseatHandoff();hud();return;}if(showNextRealmEvent()){hud();return;}
    if(G.needPan||G.needRel){openFaith();}
    // V5.6.7 preserves the V5.6.2 camera behavior: do not auto-select or recenter on a unit at turn start. The camera remains where the player left it
    // (or at the most recent battle involving their realm). Pressing Next Unit is the explicit jump action.
    hud();if(G.needTech&&techAvail(civOf(G.player)).length){G.needTech=false;openTech();}},30);
}
$('next').onclick=nextAction;

// ---------- HUD ----------
function hud(){
  if(!G)return;const civ=civOf(G.player),y=civ.y;
  const rt=civ.res?Math.max(1,Math.ceil((techCost(civ.res)-civ.sci)/Math.max(.1,y.sci))):0;
  const seasons=['Spring','Summer','Autumn','Winter'];
  setHTML($('stats'),`<div class="stat" title="Gold"><span class="ic">🪙</span><b>${Math.floor(civ.gold)}</b><span class="${y.gold<0?'neg':'pos'}">${fmt(y.gold)}</span></div>
  <div class="stat" title="Food surplus (all cities)"><span class="ic">🌾</span><b>${Math.round(G.cities.filter(c=>c.o===G.player).reduce((a,c)=>a+c.yl.f,0))}</b><span class="pos">${fmt(G.cities.filter(c=>c.o===G.player).reduce((a,c)=>a+c.yl.surplus,0))}</span></div>
  <div class="stat click" title="Science" onclick="openTech()"><span class="ic">🔬</span><b>${Math.floor(civ.sci)}</b><span class="pos">${fmt(y.sci)}</span></div>
  <div class="stat click" title="Culture — next policy ${polCost(civ)}" onclick="openPolicies()"><span class="ic">🎭</span><b>${Math.floor(civ.cul)}</b><span class="pos">${fmt(y.cul)}</span></div>
  <div class="stat click" title="Faith" onclick="openFaith()"><span class="ic">🙏</span><b>${Math.floor(civ.faith)}</b><span class="pos">${fmt(y.faith||0)}</span></div>
  <div class="stat click" title="Great People" onclick="openGreatPeople()"><span class="ic">🌠</span><b>${Object.values(civ.gpMade||{}).reduce((a,b)=>a+b,0)}</b><span class="pos">GP</span></div>
  <div class="stat click" title="Golden Age" onclick="openGoldenAgeInfo()"><span class="ic">🌟</span><b>${civ.gaTurns>0?civ.gaTurns:Math.floor(civ.gaMeter||0)+'/'+gaCost(civ)}</b></div>
  <div class="stat" title="Happiness — below 0 stops growth"><span class="ic">😊</span><b class="${y.hap<0?'neg':''}">${y.hap}</b></div>
  <div class="stat" title="Strategic resources"><span class="ic">⛏️</span><b>${Object.keys(civ.strat||{}).map(k=>RES[k].ico+civ.strat[k]).join(' ')||'—'}</b></div>`);
  $('emo').textContent=CIVS[G.player].ico;
  setHTML($('research'),civ.res?`<span style="font-size:24px">🔬</span><div><div class="rn">${TECH[civ.res].n} · ${rt} turns</div><div class="rb"><i style="width:${Math.min(100,100*civ.sci/techCost(civ.res))}%"></i></div></div>`:`<span style="font-size:24px">🔬</span><div class="rn neg">Choose research!</div>`);
  setHTML($('turnbox'),`Turn ${G.turn} · ${seasons[G.turn%4]}, ${1000+Math.floor(G.turn*1.5)} AE · ${DIFFICULTIES[G.settings.difficulty].n}/${GAME_SPEEDS[G.settings.speed].n}`);
  const nb=$('next');const u0=G.units.find(needsOrders);
  const lab=u0?'Next Unit':G.cities.some(c=>c.o===G.player&&!c.q&&!c.puppet&&!c.razing&&!c.resistance)?'Choose Production':(G.needTech&&techAvail(civ).length)?'Choose Research':'End Turn';
  $('nextlabel').textContent=lab;nb.textContent=u0?'▶':lab==='Choose Production'?'⚒':lab==='Choose Research'?'🔬':'⏳';
  // selection panel
  const s=$('sel'),su=selUnit();
  if(su&&su.o===G.player){const d=UNITS[su.k],t=G.tiles[idx(su.x,su.y)];

function bldDesc(b){const p=[];if(b.f)p.push('+'+b.f+'🌾');if(b.p)p.push('+'+b.p+'⚙');if(b.g)p.push('+'+b.g+'🪙');if(b.faith)p.push('+'+b.faith+'🙏');if(b.sci)p.push('+'+b.sci+'🔬');if(b.cul)p.push('+'+b.cul+'🎭');if(b.sciPct)p.push('+'+b.sciPct*100+'%🔬');if(b.goldPct)p.push('+'+b.goldPct*100+'%🪙');if(b.prodPct)p.push('+'+b.prodPct*100+'%⚙');if(b.hap)p.push('+'+b.hap+'😊');if(b.def)p.push('+'+b.def+'🛡️');if(b.gps)p.push('+'+b.gps+'🧙GP');if(b.gpe)p.push('+'+b.gpe+'🛠️GP');if(b.gpm)p.push('+'+b.gpm+'💰GP');if(b.gpp)p.push('+'+b.gpp+'✨GP');if(b.heritage)p.push('+'+b.heritage+'🏺');if(b.tourism)p.push('+'+b.tourism+'🌐');if(b.trainXP)p.push('+'+b.trainXP+' starting XP');if(b.unlockHero)p.push('UNLOCKS FACTION HERO');if(b.national)p.push('National Wonder');if(b.uniqueCiv!=null)p.push('Unique to '+CIVS[b.uniqueCiv].name);if(b.replaces)p.push('replaces '+BLD[b.replaces].n);if(b.reqAll)p.push('requires '+BLD[b.reqAll].n+' in every city');return p.join(' ');}
function setProd(k,id){const c=cityView;if(!c||c.o!==G.player||c.puppet||c.razing||c.resistance)return;const it={k,id};c.queue=c.queue||[];if(k==='unit'&&UNITS[id]?.hero&&((c.q&&c.q.k==='unit'&&c.q.id===id)||c.queue.some(q=>q.k==='unit'&&q.id===id))){toast(`${UNITS[id].n} is already in this city's queue.`);return;}if(!canBuild(c,it))return;if(k!=='unit'&&((c.q&&c.q.k===k&&c.q.id===id)||c.queue.some(q=>q.k===k&&q.id===id))){toast(`${prodName(it)} is already in this city's queue.`);return;}if(c.q)c.queue.push(it);else c.q=it;c.idle=false;recalcCiv(civOf(c.o));renderCity();hud();}
function cancelProd(){const c=cityView;if(!c||c.o!==G.player||c.puppet||c.razing||c.resistance||!c.q)return;const nm=prodName(c.q),kept=Math.floor(c.ps||0);c.q=null;c.idle=true;toast(`${nm} cancelled.${kept>0?` ${kept}⚙ of progress is kept for your next choice.`:''} Choose what to build instead.`);recalcCiv(civOf(c.o));renderCity();hud();}

  else if(canFoundReligion(civ)){body=`<div class="sec">Found the ${RELIGION_NAMES[G.player]||('Faith of '+CIVS[G.player].name)} (${relCost()} 🙏)</div><div class="tgrid"><div class="tcol"><h4>FOUNDER BELIEF</h4>${card(FOUNDER,relPick.f,'pickF')}</div><div class="tcol"><h4>FOLLOWER BELIEF</h4>${card(FOLLOWER,relPick.b,'pickB')}</div></div><p><button ${relPick.f&&relPick.b?'':'disabled'} onclick="doFound()">Found Religion</button></p>`;}
  else if(!civ.rel){body=`<p>Pantheon: <b>${PANTHEON[civ.pan].n}</b> — ${PANTHEON[civ.pan].d}.</p><p>${G.religions.length>=5?'All religions have been founded.':`Gather ${relCost()} faith to found a religion (${Math.floor(civ.faith)} now).`}</p>`;}
  else{body=`<p>Pantheon: <b>${PANTHEON[civ.pan].n}</b></p><p><b>${civ.rel.name}</b><br>Founder: ${FOUNDER[civ.rel.founder].n} — ${FOUNDER[civ.rel.founder].d}<br>Follower: ${FOLLOWER[civ.rel.follower].n} — ${FOLLOWER[civ.rel.follower].d}</p><p class="small">Buy Missionaries in a city screen (${missionaryCost(civ)} 🙏), then move one next to a foreign city and press Spread Faith. Religions also spread slowly on their own.</p>`;}
  const rl=G.religions.map(id=>`<div class="row" style="cursor:default;border-left:5px solid ${CIVS[id].color}"><span>${civOf(id).rel.name} <span class="small">(${CIVS[id].name})</span></span><span>${G.cities.filter(c=>c.rel===id).length} cities</span></div>`).join('');
  modal(`<h1>Faith</h1><div class="small">🙏 ${Math.floor(civ.faith)} (${fmt(civ.y.faith||0)} per turn)</div>${body}${rl?'<div class="sec">Religions of the world</div>'+rl:''}`);
  G.needPan=G.needRel=false;
}
function pickPan(k){adoptPantheon(civOf(G.player),k);closeModal();}
function pickF(k){relPick.f=k;openFaith();}function pickB(k){relPick.b=k;openFaith();}
function doFound(){if(foundReligion(civOf(G.player),relPick.f,relPick.b)){relPick={f:null,b:null};closeModal();}}
function openScore(){modal(`<h1>Ranking</h1>${[...G.civs].filter(o=>!CIVS[o.id].cs&&!CIVS[o.id].barb).sort((a,b)=>score(b)-score(a)).map((o,i)=>`<div class="row" style="cursor:default;border-left:5px solid ${CIVS[o.id].color}"><span>${i+1}. ${CIVS[o.id].ico} ${CIVS[o.id].name}${o.id===G.player?' (you)':''}${o.alive?'':' ☠'}</span><span>${score(o)}</span></div>`).join('')}`);}
function openHelp(){modal(`<h1>How to play</h1><div style="max-width:620px;line-height:1.55;font-size:14px">
<b>3D World:</b> V5.7.0 renders the realm as a tilted 3D diorama: bevelled hex tiles with painted terrain, forests, hills, snow-capped mountains, rivers, cliffs and foaming coasts. Every unit is a race-styled miniature on a base in its realm's colour; cities grow through four architectural tiers in their faction's style. Wheel to zoom, drag to pan; the classic 2D map remains available from the Menu.<br><b>Movement:</b> movement points now carry correctly across multi-hex moves. Pathfinders have 3 movement and ignore rough-terrain movement penalties; roads, embarking, flying/naval movement and Zones of Control are applied consistently. Entering an enemy ZOC no longer incorrectly ends movement by itself — moving between tiles controlled by the same enemy does.<br><b>Strategic Depth:</b> the roster now includes Skirmishers, Heavy Infantry, War Beasts, Battle Priests and Bombards alongside expanded faction-unique troops and early infrastructure such as Potters, Hunting Lodges, Lumber Guilds, Caravanserais and Training Yards.<br><b>Faction Heroes:</b> Steelcraft unlocks the Hall of Legends. Completing, rushing, or purchasing that National Wonder unlocks your civilization's unique Hero and triggers the Faction Hero Available presentation. Only your civilization's Hero can be trained, only one may be active at a time, and a fallen Hero returns to availability after a short cooldown. Heroes earn XP and promotions like normal military units, have a unique faction ability, and unlock separate Hero talent points at 15, 40 and 75 XP. Use the ★ HERO button on a selected Hero to specialize them. Heroes can also forge up to 3 permanent earned Traits through accomplishments such as monster kills, city captures, survival under extreme damage, realm defense, wilderness campaigning and long-distance travel. The Military Overview now includes a Hall of Legends and each active Hero has a full character sheet. Hero XP, talents, Traits and career history persist through death and return.<br><b>Mouse:</b> click a unit to select; click a highlighted tile to move (multi-turn paths are followed automatically); click an enemy to attack. Drag to pan, wheel to zoom, minimap to jump. Right-click deselects.<br>
<b>Keys:</b> Enter/Space next action · Home recenter · B found city · F fortify/unfortify · Q improve tile · R road · arrows/WASD pan · T tech · P policies · D diplomacy.<br><span class="small">Turn start no longer recenters the camera. Battles involving your units or cities receive automatic combat focus. Fortified units are skipped by Next Unit until unfortified or moved.</span><br><br>
<b>Exploration:</b> discover Ancient Ruins, Moon Shrines and Abandoned Towers for realm rewards. Monster lairs spawn fantasy creatures until a realm clears the den.<br><br>
<b>Early buildings:</b> Workshop Shed, Storehouse, Watch Post, Herbalist and Meeting Hall are available immediately, giving every new city useful choices before its first technologies finish.<br><b>Cities</b> work tiles automatically (choose a focus or lock tiles), grow with surplus food (2 food per citizen), and expand borders with culture or buy adjacent unowned tiles directly with gold from the city screen. Cities support production queues and direct gold purchases. Player cities may manually bombard one chosen enemy military unit within 2 tiles once per turn (3 with a Castle). Captured cities can be Annexed, Puppeted, Razed, or Liberated when eligible. Use the Empire and Military Overview buttons on the left rail to manage a large realm.<br>
<b>Happiness:</b> each city and citizen causes unhappiness; luxury resources (improve them with Laborers) and buildings offset it. Aethermoor includes the complete Civilization V luxury roster plus fantasy luxuries such as Starstones, Dragon Gold, Amberwine, Emberspice, Moonsilk and Moonpearl. Below 0 your cities stop growing.<br>
<b>Strategic resources</b> (Mithril, Stormsteeds, Arcane Crystal) must be improved inside your borders to build the units that need them.<br>
<b>Combat:</b> terrain, fortification and city walls boost defense. Ranged units use a dedicated Ranged Attack button, then fire on a highlighted target within their range without melee retaliation; melee units capture cities at 0 HP. Fighting earns XP; veteran units choose promotions such as Shock, Medic, Range and Logistics. Great Generals strengthen nearby armies.<br>
<b>Specialists:</b> specialist slots come from buildings. Assign citizens in the city screen for focused yields and faster Great Person generation.<br><b>Great People:</b> Libraries/Universities create Scientists, Smithies create Engineers, Markets/Banks create Merchants, Shrines/Temples create Prophets, and combat creates Generals. Great Scientists, Engineers, Merchants and Prophets can either use their one-time ability or create a permanent tile improvement.<br><b>Natural & National Wonders:</b> explore to discover legendary Natural Wonders. National Wonders require their prerequisite building in every non-puppet city and may only be built once per realm.<br><b>Culture & Tourism:</b> Bards assigned to cultural buildings generate Culture, Tourism and Inspiration. Inspiration creates Great Works; World/National/Natural Wonders also support Tourism. Open Borders and international trade improve Tourism pressure. Become Influential over every surviving major realm for a Cultural Victory.<br><b>Archaeology:</b> Antiquity Sites appear around the world. After researching Arcane Academy, move a Pathfinder onto one to recover an Artifact Great Work.<br>
<b>Golden Ages:</b> positive happiness and culture fill the Golden Age meter, temporarily boosting city production, gold, science and culture.<br>
<b>Trade & Diplomacy:</b> major realms can exchange lump-sum gold, gold per turn, luxury resources and one-sided Open Borders. Caravan/Cargo Ship routes provide recurring gold/science, Philosophy enables Research Agreements, Chivalry enables Defensive Pacts, and Arcane Academy unlocks espionage. Closed borders block every foreign unit while at peace; Friendly/Allied city-states grant access. Peace with your realm always requires your approval. War declarations appear on the right-side notification feed.<br><b>Civ-style combat rules:</b> enemy land/naval units exert Zones of Control that end movement, melee attacks gain flanking bonuses from nearby friendly troops, attacking across a river suffers -20% unless the unit has Amphibious, siege units must Set Up before firing, and older units can be upgraded for gold in friendly territory. Warships bombard coastal targets, hostile ships can blockade coastal cities and sea trade, Citadels damage adjacent enemies, and garrisons strengthen city defense/bombardment. Wounded units can Fortify Until Healed.<br><b>Laborers:</b> Auto Improve now continually seeks useful owned tiles, completes improvements and later builds roads.<br><b>City-states</b> offer quests, protection pledges, tribute demands and influence competition in addition to gold gifts (Friendly 30 / Allied 60 influence). Completing their quests grants large influence rewards. They may still be conquered. <b>Monster lairs</b> spawn Goblin Raiders, Ogre Brutes, Cave Trolls and Young Wyrms. Defeat any defender, then step onto the empty lair to destroy it immediately and collect gold; stronger dens pay more. <b>Faith</b> buys a pantheon, then a religion whose followers grant bonuses; Missionaries convert cities. <b>Ships</b> need a coastal city (Seafaring); Warships cross deep seas (Navigation).<br><b>Audio:</b> music and sound-effect volume can be changed from the Menu. The soundtrack switches between exploration and major-war themes.<br><b>Winning:</b> Domination (last realm standing), Science (research Astral Ascension), Culture (become Influential over every surviving major realm), or the highest score at turn ${G.maxTurn}.</div>`);}
function showWin(){const w=G.winner;const C=w.civ>=0?CIVS[w.civ]:null;
  modal(`<h1 style="text-align:center">${w.type==='Defeat'?'💀 Your realm has fallen':w.civ===G.player?'🏆 Victory!':'The age ends'}</h1><p style="text-align:center;font-size:16px">${C?C.name+' ('+C.leader+') wins by <b>'+w.type+'</b>.':''}</p><div style="text-align:center"><button onclick="localStorage.removeItem('aethermoor_save2');location.reload()">New Game</button></div>`);}

// ---------- input ----------
let drag=null;
function initInput(){
  addEventListener('pointerdown',unlockAudio,{once:true});addEventListener('click',e=>{if(e.target&&e.target.closest&&e.target.closest('button,select,.card,.row'))playSfx('click',.45);});
  cvs.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false,btn:e.button};});
  addEventListener('mousemove',e=>{
    if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)drag.moved=true;if(drag.moved){cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;}return;}
    if(!G||e.target!==cvs)return;setHover(toTile(e.clientX,e.clientY));});
  addEventListener('mouseup',e=>{if(!drag)return;const d=drag;drag=null;if(d.moved||e.target!==cvs||!running||$('modal').style.display==='flex')return;
    if(d.btn===2){clearSel();return;}clickTile(toTile(e.clientX,e.clientY));});
  cvs.addEventListener('contextmenu',e=>e.preventDefault());
  cvs.addEventListener('wheel',e=>{e.preventDefault();const nz=Math.min(1.7,Math.max(.42,cam.z*(e.deltaY<0?1.12:1/1.12)));
    const wx=(e.clientX-view.w/2)/cam.z+cam.x,wy=(e.clientY-view.h/2)/cam.z+cam.y;cam.z=nz;cam.x=wx-(e.clientX-view.w/2)/nz;cam.y=wy-(e.clientY-view.h/2)/nz;},{passive:false});
  miniC.addEventListener('mousedown',e=>{const r=miniC.getBoundingClientRect(),p=miniToWorld((e.clientX-r.left)*miniC.width/r.width,(e.clientY-r.top)*miniC.height/r.height);cam.x=p.x;cam.y=p.y;});
  addEventListener('keydown',e=>{
    if(!G||!running)return;const k=e.key.toLowerCase();
    if(k==='escape'){if($('modal').style.display==='flex')closeModal();else clearSel();return;}
    if(k==='home'){recenterRealm();return;}
    if($('modal').style.display==='flex')return;
    if(k==='enter'||k===' '){e.preventDefault();nextAction();}
    else if(k==='e'){const su=selUnit();if(su&&su.k!=='worker'&&su.k!=='settler')act('explore');}else if(k==='i'){const su=selUnit();if(su&&su.k==='worker')act('autoimp');}
    else if(k==='b')act('found');else if(k==='f')act('fort');else if(k==='z')act('sleep');else if(k==='q')act('improve');else if(k==='r')act('road');else if(k==='x'){const su=selUnit();if(su&&canPromote(su))openPromotions(su.id);}
    else if(k==='t')openTech();else if(k==='p')openPolicies();else if(k==='d')openDiplo();else if(k==='x')openEspionage();
  });
  addEventListener('resize',resize);
}
function setHover(t){
  hover=t;const key=t?t.x+','+t.y:'';if(key===lastHoverKey)return;lastHoverKey=key;
  const u=selUnit();selPath=null;
  if(u&&t&&u.o===G.player&&G.vis[G.player][idx(t.x,t.y)]&&!(t.x===u.x&&t.y===u.y)){const p=pathTo(u,t.x,t.y,500);if(p&&p.length)selPath=p;}
  tileInfo(t,u);
}
function tileInfo(t,u){
  const el=$('info');if(!t||!G.vis[G.player][idx(t.x,t.y)]){el.style.display='none';return;}
  const vis=G.vis[G.player][idx(t.x,t.y)]===2,y=tileYield(t,G.player);
  let h=`<b>${t.f?FEAT[t.f].n+' · ':''}${T[t.t].n}</b><br>🌾${y.f} ⚙${y.p} 🪙${y.g}`;
  if(t.r)h+=`<br>${RES[t.r].ico} ${RES[t.r].n} <span class="small">(${RES[t.r].type})</span>`;
  if(t.imp)h+=`<br>🔨 ${IMP[t.imp].n}`;if(t.camp)h+='<br>☠️ Barbarian camp';if(t.road)h+=' 🛤️';
  if(T[t.t].def||t.f)h+=`<br><span class="small">+${Math.round(Math.max(T[t.t].def||0,t.f?FEAT[t.f].def:0)*100)}% defense · move ${Math.max(T[t.t].mv||1,t.f?FEAT[t.f].mv:1)}</span>`;
  if(t.own>=0)h+=`<br><span style="color:${CIVS[t.own].color}">■</span> ${CIVS[t.own].name}`;
  if(vis){
    if(t.nw&&NATURAL_WONDERS[t.nw]){const w=NATURAL_WONDERS[t.nw];h+=`<br><b style="color:#fff0a8">${w.ico} ${w.n}</b> — ${w.d}`;}
    if(t.site&&SITE[t.site])h+=`<br><b style="color:#d7c7ff">${SITE[t.site].ico} ${SITE[t.site].n}</b> — ${SITE[t.site].d}`;
    if(t.camp){const L=LAIR[typeof t.camp==='string'?t.camp:'goblin']||LAIR.goblin;h+=`<br><b style="color:#ff9b8f">${L.ico} ${L.n}</b> — Monster lair`;} 
    const us=unitsAt(t.x,t.y);for(const q of us)h+=`<br>${UNITS[q.k].ico} ${CIVS[q.o].name} ${q.gpName||UNITS[q.k].n} (${q.hp}hp${!isCiv(q)?`, ${q.xp||0}xp`:''})`;
    if(u&&canAttackTile(u,t)){const rng=!!UNITS[u.k].rstr,A=unitStrength(u,rng?'ranged':'attack',null,t);let D,name;
      if(t.city!=null){D=cityOf(t.city).str;}else{const d=bestDefender(t.x,t.y);D=d?unitStrength(d,'defend',u,t):1;}
      const dealt=Math.round(30*Math.exp(.04*(A-D))),taken=rng?0:Math.round(30*Math.exp(.04*(D-A))),mods=combatModifierText(u,t);
      h+=`<div style="margin-top:4px;color:#ff9b9b"><b>⚔ Combat Preview</b>: deal ~${dealt}${rng?'':' · take ~'+taken}</div>${mods.length?`<div class="small" style="max-width:280px">${mods.join(' · ')}</div>`:''}`;}}
  el.style.display='block';el.innerHTML=h;
}
function clickTile(t){
  if(!t)return;const v=G.vis[G.player][idx(t.x,t.y)];
  if(cityView&&cityBombardMode){if(cityBombard(cityView,t,false)){cityBombardMode=false;targets=null;renderCity();hud();miniDirty=true;}else toast(`Choose an enemy military unit within ${cityBombardRange(cityView)} tiles.`);return;}
  if(cityView&&cityTileBuyMode){if(!buyCityTile(cityView,t))toast('Choose a gold-highlighted unowned tile adjacent to this city.');return;}
  {const c=t.city!=null?cityOf(t.city):null,stack=unitsAt(t.x,t.y).filter(u=>u.o===G.player),su0=selUnit();if(c&&c.o===G.player&&stack.length&&(!su0||(su0.x===t.x&&su0.y===t.y))){openTileStackSelector(t);return;}}
  if(cityView){
    if(t.own===cityView.o&&hdist(t,cityView)<=3&&t.city==null&&cityView.o===G.player&&!T[t.t].block){const i=idx(t.x,t.y);cityView.lock=cityView.lock||[];const k=cityView.lock.indexOf(i);k>=0?cityView.lock.splice(k,1):cityView.lock.push(i);recalcCiv(civOf(cityView.o));renderCity();return;}
    if(t.city!=null&&cityOf(t.city).o===G.player){selectCity(cityOf(t.city));return;}
    if(!unitsAt(t.x,t.y).some(u=>u.o===G.player)){clearSel();return;}
  }
  const u=selUnit();
  if(u&&v){if(t.own>=0&&t.own!==u.o&&!atWar(u.o,t.own)&&!territoryAccess(t.own,u.o)){toast(`${CIVS[t.own].name}'s borders are closed. Negotiate Open Borders in Diplomacy before entering.`);return;}
    if(u.auto&&(t.x!==u.x||t.y!==u.y)&&u.o===G.player)u.auto=null;
    const isRanged=!!UNITS[u.k].rstr&&unitRange(u)>1;
    if(isRanged&&rangedAttackMode){if(canAttackTile(u,t)&&v===2){attack(u,t);rangedAttackMode=false;miniDirty=true;afterAct(u);return;}toast(`Choose a highlighted enemy within ${unitRange(u)} tiles.`);return;}
    if(canAttackTile(u,t)&&v===2){if(isRanged){toast('Use the Ranged Attack button, then choose a highlighted enemy.');return;}attack(u,t);miniDirty=true;afterAct(u);return;}
    if(t.x!==u.x||t.y!==u.y){
      const foe=(t.city!=null&&cityOf(t.city).o!==G.player)||unitsAt(t.x,t.y).some(q=>q.o!==G.player);
      if(foe&&v===2&&!isCiv(u)){ // approach an enemy
        if(!atWar(G.player,t.city!=null?cityOf(t.city).o:unitsAt(t.x,t.y)[0].o)){toast('We are at peace. Declare war in Diplomacy.');return;}
        let best=null;for(const n of nbrs(t.x,t.y)){if(!canEnter(u,n))continue;const p=pathTo(u,n.x,n.y,600);if(p&&(!best||p.length<best.length))best=p;}
        if(best){u.path=best.map(q=>idx(q.x,q.y));u.fort=u.sleep=false;runPath(u);afterAct(u);}return;}
      if(!foe&&gotoTile(u,t.x,t.y)){afterAct(u);return;}
    }
  }
  const us=unitsAt(t.x,t.y).filter(x=>x.o===G.player);
  if(us.length&&v===2){const i=us.findIndex(x=>G.sel&&G.sel.id===x.id);selectUnit(us[(i+1)%us.length]);return;}
  if(t.city!=null&&cityOf(t.city).o===G.player){selectCity(cityOf(t.city));return;}
  clearSel();
}
function afterAct(u){lastHoverKey='';rangedAttackMode=false;if(!G.units.includes(u)){clearSel();return;}refreshSel();}

// ---------- main loop ----------
function frame(now){
  if(running){
    const s=12/cam.z;if(!$('modal').style.display||$('modal').style.display==='none'){if(keys.left)cam.x-=s;if(keys.right)cam.x+=s;if(keys.up)cam.y-=s;if(keys.down)cam.y+=s;}
    cam.x=Math.min(Math.max(cam.x,0),G.W*HW);cam.y=Math.min(Math.max(cam.y,0),G.H*S*1.5);
    draw(now);
  }
  requestAnimationFrame(frame);
}
const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=1;if(k==='arrowright'||k==='d'&&false)keys.right=1;if(k==='arrowup'||k==='w')keys.up=1;if(k==='arrowdown'||k==='s')keys.down=1;if(k==='arrowright')keys.right=1;});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=0;if(k==='arrowright')keys.right=0;if(k==='arrowup'||k==='w')keys.up=0;if(k==='arrowdown'||k==='s')keys.down=0;});
function bootAethermoor(){
  if(window.__aethermoorBooted)return;
  const mapEl=document.getElementById('map'),miniEl=document.getElementById('mini'),startEl=document.getElementById('start');
  if(!mapEl||!miniEl||!startEl){setTimeout(bootAethermoor,25);return;}
  window.__aethermoorBooted=true;
  cvs=mapEl;miniC=miniEl;miniX=miniC.getContext('2d');
  resize();if(typeof threeWorldInit==='function')threeWorldInit();initInput();preloadExternalSprites();showStart();requestAnimationFrame(frame);
  setInterval(()=>{if(running&&G){hud();refreshMusic();}},500);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootAethermoor,{once:true});
else bootAethermoor();
setTimeout(bootAethermoor,0);
window.addEventListener('load',bootAethermoor,{once:true});

</script>
